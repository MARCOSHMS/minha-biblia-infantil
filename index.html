// Narrativas originais em linguagem infantil, baseadas nas passagens bíblicas indicadas.
window.STORIES = [
{ id:1,book:'Gênesis',testament:'Antigo Testamento',title:'A criação do mundo',ref:'Gênesis 1–2',emoji:'🌍',lesson:'A criação é um presente de Deus. Podemos cuidar da natureza, dos animais e de todas as pessoas.',pages:[
'No começo, antes de existir o céu azul, as montanhas, os mares e as flores, Deus criou todas as coisas. A Bíblia conta que a terra ainda não tinha a beleza que conhecemos. Então Deus começou sua obra criadora, e tudo o que Ele fazia era bom.',
'Primeiro, Deus criou a luz e separou a luz da escuridão. Depois formou o céu, reuniu as águas e fez aparecer a terra seca. A terra ficou cheia de plantas, árvores e frutos. Deus colocou o sol para iluminar o dia, a lua e as estrelas para enfeitar a noite.',
'Depois vieram os peixes, que nadavam nas águas, e as aves, que voavam pelo céu. Deus criou também os animais que vivem na terra: os grandes e os pequenos, os que correm, saltam e caminham. Cada criatura tinha seu lugar no mundo.',
'Por fim, Deus criou o ser humano à sua imagem e semelhança, homem e mulher, confiando a eles a missão de cuidar da criação. Deus viu tudo o que havia feito e contemplou que era muito bom. No sétimo dia, descansou, mostrando a importância de parar, agradecer e celebrar.' ]},
{ id:2,book:'Gênesis',testament:'Antigo Testamento',title:'Adão e Eva no jardim',ref:'Gênesis 2–3',emoji:'🌳',lesson:'Deus nos dá liberdade e nos ensina a escolher o bem. Quando erramos, podemos reconhecer o erro e buscar o caminho certo.',pages:[
'Depois de criar o mundo, Deus preparou um jardim muito bonito chamado Éden. Havia árvores, rios, frutos e muitos animais. Ali viviam Adão e Eva, que receberam a missão de cuidar daquele lugar e desfrutar de seus presentes.',
'Deus ensinou que poderiam comer dos frutos das árvores, mas deveriam respeitar um limite. A serpente conversou com Eva e a convenceu a desobedecer. Eva comeu o fruto e ofereceu a Adão, que também comeu. Eles perceberam que tinham feito algo errado e ficaram com medo.',
'Deus chamou os dois e perguntou o que havia acontecido. Eles precisaram deixar o jardim, mas Deus não deixou de cuidar deles. A história mostra que nossas escolhas têm consequências, mas também que Deus continua próximo e deseja que aprendamos a fazer o bem.' ]},
{ id:3,book:'Gênesis',testament:'Antigo Testamento',title:'Caim e Abel',ref:'Gênesis 4',emoji:'🌾',lesson:'A inveja e a raiva podem machucar. Deus nos chama a cuidar uns dos outros e resolver conflitos com amor.',pages:[
'Adão e Eva tiveram dois filhos: Caim, que trabalhava na terra, e Abel, que cuidava de ovelhas. Os irmãos apresentaram ofertas a Deus. Abel ofereceu o melhor de seu rebanho, e Caim também levou frutos de sua colheita.',
'Caim ficou muito irritado e com inveja. Deus o advertiu para não deixar o pecado dominar seu coração. Mesmo assim, Caim não controlou sua raiva e fez mal ao irmão. Foi uma tragédia para toda a família.',
'Deus perguntou por Abel e mostrou a Caim a gravidade do que havia feito. Essa história ensina que a vida de cada pessoa é preciosa e que devemos procurar ajuda quando sentimos raiva, ciúme ou vontade de machucar alguém.' ]},
{ id:4,book:'Gênesis',testament:'Antigo Testamento',title:'Noé e a grande arca',ref:'Gênesis 6–9',emoji:'🛶',lesson:'A fidelidade, a coragem e o cuidado com a vida são importantes. O arco-íris recorda a aliança de Deus com a criação.',pages:[
'A Bíblia conta que muitas pessoas haviam se esquecido de fazer o bem. Noé, porém, procurava viver com justiça e amizade com Deus. Então recebeu uma missão enorme: construir uma arca, um barco muito grande, porque viria uma grande chuva.',
'Noé trabalhou com paciência, mesmo quando outros talvez não entendessem o que estava fazendo. Sua família entrou na arca, e os animais vieram em pares. Quando a chuva começou, todos ficaram protegidos dentro do barco. A água cobriu a terra por muitos dias.',
'Quando a chuva parou, Noé esperou com cuidado até que fosse seguro sair. A família e os animais encontraram uma terra renovada. Noé agradeceu a Deus, e apareceu no céu um arco-íris, sinal da aliança de Deus com todos os seres vivos.' ]},
{ id:5,book:'Gênesis',testament:'Antigo Testamento',title:'A torre de Babel',ref:'Gênesis 11,1-9',emoji:'🗼',lesson:'A união verdadeira nasce do respeito. Podemos trabalhar juntos sem querer ser melhores que os outros.',pages:[
'Os povos daquela região falavam a mesma língua e decidiram construir uma cidade com uma torre muito alta. Queriam tornar seu nome famoso e mostrar que poderiam alcançar o céu por suas próprias forças.',
'A Bíblia apresenta essa construção como um sinal de orgulho: em vez de reconhecerem seus limites e respeitarem a Deus, aquelas pessoas queriam colocar a si mesmas no centro de tudo. A comunicação entre elas se confundiu, e o projeto foi interrompido.',
'As pessoas se espalharam por diferentes lugares. A história nos lembra que a diversidade de povos e línguas faz parte da humanidade e que a verdadeira grandeza está na humildade, na cooperação e no respeito.' ]},
{ id:6,book:'Gênesis',testament:'Antigo Testamento',title:'Deus chama Abraão',ref:'Gênesis 12; 15; 17',emoji:'⭐',lesson:'A fé é confiar em Deus e caminhar com esperança, mesmo quando ainda não sabemos todos os detalhes.',pages:[
'Abraão vivia em sua terra quando recebeu um chamado de Deus: deveria partir para uma terra que ainda conheceria. Deus prometeu acompanhá-lo e fazer de sua família uma grande bênção para muitos povos.',
'Abraão e Sara já eram idosos e não tinham filhos. A promessa parecia difícil, mas Deus renovou sua esperança. Certa noite, Abraão olhou para o céu e viu inúmeras estrelas. Deus usou aquela imagem para falar de uma família tão numerosa que seria difícil contar.',
'Abraão partiu confiando na promessa. Sua caminhada teve desafios e momentos de dúvida, mas ele continuou aprendendo a confiar. Por isso é lembrado como exemplo de fé.' ]},
{ id:7,book:'Gênesis',testament:'Antigo Testamento',title:'O nascimento de Isaac',ref:'Gênesis 18; 21',emoji:'👶',lesson:'Deus acompanha nossas famílias e nos ensina a ter esperança e gratidão.',pages:[
'Abraão e Sara esperavam havia muitos anos o filho prometido por Deus. Quando ouviram que teriam uma criança, acharam difícil acreditar, pois já eram idosos. Mesmo assim, Deus cumpriu sua promessa.',
'Sara deu à luz Isaac, e a casa se encheu de alegria. Seu nome está ligado ao riso, pois a chegada do menino transformou a surpresa em felicidade. Abraão e Sara agradeceram pelo presente recebido.',
'A história recorda que a esperança pode renascer mesmo depois de uma longa espera. Isaac cresceu e se tornou parte importante da história do povo de Deus.' ]},
{ id:8,book:'Gênesis',testament:'Antigo Testamento',title:'Jacó e Esaú',ref:'Gênesis 25; 27; 33',emoji:'🤝',lesson:'A reconciliação é possível. Pedir perdão e perdoar ajudam a reconstruir a confiança.',pages:[
'Isaac e Rebeca tiveram filhos gêmeos: Esaú e Jacó. Os irmãos eram diferentes e, quando cresceram, tiveram conflitos por causa de direitos e bênçãos familiares. A rivalidade fez Jacó fugir para longe.',
'Muitos anos depois, Jacó decidiu voltar. Tinha medo de encontrar Esaú, pois lembrava do sofrimento que havia causado. Durante a viagem, pensou no passado e pediu a Deus que o acompanhasse.',
'Quando os irmãos finalmente se encontraram, Esaú correu ao encontro de Jacó e o abraçou. Em vez de vingança, houve acolhimento. A história ensina que o perdão pode abrir um caminho novo.' ]},
{ id:9,book:'Gênesis',testament:'Antigo Testamento',title:'José do Egito',ref:'Gênesis 37; 39–45',emoji:'🌈',lesson:'Mesmo nas dificuldades, podemos agir com honestidade, perseverança e generosidade.',pages:[
'José era um dos filhos de Jacó e recebeu de seu pai uma túnica especial. Seus irmãos sentiram inveja e, em vez de conversar, fizeram algo muito injusto: venderam José para viajantes. Ele foi levado ao Egito, longe de sua família.',
'No Egito, José enfrentou momentos difíceis. Foi acusado injustamente e ficou preso, mas não abandonou a esperança. Deus o ajudou a compreender sonhos, e sua sabedoria chamou a atenção do faraó. José recebeu a responsabilidade de organizar os alimentos para os anos de fome.',
'Quando a fome chegou, os irmãos de José foram ao Egito buscar comida e não o reconheceram. José poderia ter se vingado, mas escolheu perdoar. Depois de conversar com eles, revelou quem era e ajudou a reunir toda a família. Sua história mostra que o perdão pode transformar uma grande tristeza.' ]},
{ id:10,book:'Êxodo',testament:'Antigo Testamento',title:'Moisés e a sarça ardente',ref:'Êxodo 3–4',emoji:'🔥',lesson:'Deus chama cada pessoa a fazer o bem. Mesmo quando sentimos medo, podemos pedir ajuda e coragem.',pages:[
'Moisés vivia cuidando de ovelhas quando viu algo extraordinário: um arbusto estava em chamas, mas não se consumia. Ao se aproximar, ouviu Deus chamá-lo pelo nome e pedir que tirasse as sandálias, pois estava em lugar santo.',
'Deus contou que tinha visto o sofrimento dos israelitas no Egito e queria libertá-los. Moisés ficou inseguro e perguntou como conseguiria falar com o faraó. Deus prometeu estar com ele e enviou também seu irmão Aarão para ajudá-lo.',
'Moisés aceitou a missão. A história mostra que não precisamos enfrentar desafios sozinhos: podemos buscar a ajuda de Deus e das pessoas que caminham conosco.' ]},
{ id:11,book:'Êxodo',testament:'Antigo Testamento',title:'A saída do Egito e o Mar Vermelho',ref:'Êxodo 12–14',emoji:'🌊',lesson:'A coragem cresce quando caminhamos juntos e confiamos que Deus não nos abandona.',pages:[
'Os israelitas viviam como escravos no Egito. Depois de muitos acontecimentos, o faraó permitiu que partissem. Moisés conduziu o povo pelo caminho do deserto, levando famílias, crianças e seus pertences.',
'Quando chegaram perto do Mar Vermelho, perceberam que o exército do faraó vinha atrás deles. O povo ficou assustado, pois parecia não haver saída. Moisés pediu que tivessem confiança. Segundo a narrativa bíblica, Deus abriu um caminho pelo mar, e o povo atravessou em segurança.',
'Quando todos chegaram ao outro lado, as águas voltaram ao seu lugar. Os israelitas celebraram a libertação e agradeceram a Deus. Foi o começo de uma nova etapa, na qual aprenderiam a viver como povo livre.' ]},
{ id:12,book:'Êxodo',testament:'Antigo Testamento',title:'Os Dez Mandamentos',ref:'Êxodo 19–20; 24',emoji:'📜',lesson:'Os mandamentos ensinam a amar a Deus e ao próximo, respeitando a vida, a família e a verdade.',pages:[
'Depois de sair do Egito, o povo chegou ao monte Sinai. Moisés subiu a montanha para encontrar-se com Deus. Ali recebeu orientações para que aquela comunidade pudesse viver em paz e justiça.',
'Entre essas orientações estavam os Dez Mandamentos. Eles ensinam a amar a Deus, respeitar pai e mãe, não matar, não roubar, não mentir e não desejar injustamente o que pertence aos outros. São caminhos para proteger a dignidade das pessoas.',
'Moisés levou os ensinamentos ao povo. Os mandamentos não eram apenas palavras escritas em pedras: deveriam orientar as escolhas de cada dia, nas famílias e na comunidade.' ]},
{ id:13,book:'Josué',testament:'Antigo Testamento',title:'Josué e as muralhas de Jericó',ref:'Josué 6',emoji:'🏰',lesson:'A confiança, a união e a perseverança ajudam a enfrentar desafios. A vitória não deve ser motivo de orgulho ou crueldade.',pages:[
'Depois de Moisés, Josué tornou-se líder do povo de Israel. Eles chegaram perto da cidade de Jericó, protegida por grandes muralhas. A cidade parecia impossível de alcançar.',
'A narrativa conta que Deus orientou Josué a conduzir o povo em uma procissão ao redor da cidade durante vários dias. Sacerdotes levavam a arca da aliança e tocavam trombetas. No último dia, depois do toque das trombetas e do grito do povo, as muralhas caíram.',
'Josué conduziu o povo conforme a missão recebida. A história é lida como um relato de confiança em Deus, mas também nos convida a buscar soluções sem violência e a lembrar que a força deve servir ao bem.' ]},
{ id:14,book:'Juízes',testament:'Antigo Testamento',title:'Sansão, o homem de grande força',ref:'Juízes 13–16',emoji:'💪',lesson:'A força verdadeira inclui responsabilidade, humildade e domínio de si mesmo.',pages:[
'Sansão nasceu depois que um anjo anunciou seu nascimento a seus pais. Ele recebeu uma missão especial e foi consagrado a Deus. A Bíblia o descreve como alguém de força extraordinária, chamado a defender seu povo.',
'Sansão realizou feitos impressionantes, mas também tomou decisões impulsivas e se envolveu em conflitos. Dalila insistiu para descobrir o segredo de sua força. Sansão acabou contando que seus cabelos nunca haviam sido cortados como sinal de sua consagração.',
'Quando foi capturado, Sansão reconheceu sua fragilidade e pediu a Deus força para um último ato. Sua história é complexa e nos ensina que os dons recebidos precisam ser usados com responsabilidade.' ]},
{ id:15,book:'Rute',testament:'Antigo Testamento',title:'Rute e Noemi',ref:'Rute 1–4',emoji:'🌾',lesson:'Lealdade, amizade e cuidado com a família são formas concretas de amor.',pages:[
'Noemi ficou viúva e perdeu também seus filhos. Decidiu voltar para sua terra, Belém. Sua nora Rute, que também era viúva, escolheu acompanhá-la, mesmo sabendo que teria de deixar seu próprio povo.',
'Rute trabalhou recolhendo espigas que sobravam nos campos para conseguir alimento. O dono do campo, Booz, percebeu sua dedicação e pediu que ela fosse protegida. Rute e Noemi encontraram apoio e esperança.',
'Com o tempo, Rute e Booz formaram uma família. Seu filho foi antepassado do rei Davi. A história mostra como a bondade de pessoas comuns pode fazer parte de uma história muito maior.' ]},
{ id:16,book:'1 Samuel',testament:'Antigo Testamento',title:'O pequeno Samuel escuta Deus',ref:'1 Samuel 3',emoji:'👂',lesson:'É importante aprender a escutar com atenção, especialmente quando alguém precisa de nós.',pages:[
'Samuel era ainda menino e ajudava o sacerdote Eli no templo. Certa noite, enquanto todos descansavam, ouviu alguém chamar seu nome. Pensou que fosse Eli e correu até ele, mas Eli disse que não o havia chamado.',
'Isso aconteceu mais de uma vez. Então Eli percebeu que Deus poderia estar chamando Samuel e ensinou o menino a responder: “Fala, Senhor, teu servo escuta”. Samuel voltou a descansar e ouviu novamente a voz.',
'Samuel respondeu com atenção e, ao crescer, tornou-se profeta. A história nos ensina a cultivar o silêncio, a escuta e a disposição para fazer o bem.' ]},
{ id:17,book:'1 Samuel',testament:'Antigo Testamento',title:'Davi e Golias',ref:'1 Samuel 17',emoji:'🪨',lesson:'Coragem não depende do tamanho. A confiança e a inteligência podem nos ajudar a enfrentar desafios.',pages:[
'Os israelitas enfrentavam os filisteus. Um guerreiro enorme chamado Golias desafiava o exército, e todos tinham medo. Davi era um jovem pastor que foi levar alimento aos irmãos e ouviu as provocações do gigante.',
'Davi acreditava que Deus o acompanhava e não quis usar uma armadura pesada que não conhecia. Pegou seu cajado, escolheu cinco pedras lisas no riacho e levou sua funda. Com uma pedra, atingiu Golias e o derrubou.',
'O povo se animou, e Davi ficou conhecido por sua coragem. A história não ensina a procurar brigas, mas a não se deixar dominar pelo medo e a usar os próprios talentos com responsabilidade.' ]},
{ id:18,book:'2 Samuel',testament:'Antigo Testamento',title:'Davi se torna rei',ref:'2 Samuel 5–7',emoji:'👑',lesson:'Liderar é servir. Quem tem responsabilidade deve agir com justiça e cuidar das pessoas.',pages:[
'Davi, que antes cuidava de ovelhas, foi reconhecido como rei de Israel. Ele reuniu as tribos e estabeleceu Jerusalém como capital. O povo viveu um tempo de organização e celebração.',
'Davi desejava construir uma casa grandiosa para a arca da aliança, mas o profeta Natã transmitiu uma promessa diferente: Deus acompanharia a família de Davi e sua descendência teria um papel importante na história do povo.',
'Davi também cometeu erros graves, mostrando que até os reis precisam reconhecer suas falhas. A Bíblia conta que ele se arrependeu e buscou a misericórdia de Deus.' ]},
{ id:19,book:'1 Reis',testament:'Antigo Testamento',title:'A sabedoria de Salomão',ref:'1 Reis 3; 5–8',emoji:'🦉',lesson:'A sabedoria é mais valiosa que riquezas. Devemos pedir discernimento para escolher o que é justo.',pages:[
'Salomão tornou-se rei depois de Davi. Em um sonho, Deus lhe perguntou o que desejava receber. Salomão não pediu riquezas nem vida longa: pediu um coração capaz de compreender e governar com justiça.',
'Deus agradou-se do pedido e concedeu grande sabedoria. Uma história famosa conta que duas mulheres discutiam sobre um bebê. Salomão encontrou uma maneira de descobrir quem realmente amava a criança e queria protegê-la.',
'Salomão também construiu o Templo de Jerusalém. Sua história nos lembra que conhecimento e poder devem ser usados para servir, proteger e fazer justiça.' ]},
{ id:20,book:'1 Reis',testament:'Antigo Testamento',title:'O profeta Elias e a viúva',ref:'1 Reis 17',emoji:'🍞',lesson:'A partilha transforma pouco em cuidado. A generosidade é importante mesmo em tempos difíceis.',pages:[
'Durante um período de seca, o profeta Elias foi enviado a uma cidade onde encontrou uma viúva que tinha apenas um pouco de farinha e azeite. Ela estava preocupada, pois a comida quase havia acabado.',
'Elias pediu que ela preparasse um pequeno pão e confiasse na palavra de Deus. A Bíblia conta que a farinha e o azeite não faltaram durante aquele período. A viúva e seu filho puderam se alimentar.',
'A história mostra o cuidado de Deus e a coragem daquela mulher. Também nos ensina a partilhar, a acolher quem precisa e a não desprezar pequenos gestos de bondade.' ]},
{ id:21,book:'Tobias',testament:'Antigo Testamento',title:'Tobias e o anjo Rafael',ref:'Tobias 5–12',emoji:'👼',lesson:'A amizade, a confiança e a ajuda de Deus podem nos acompanhar nas jornadas da vida.',pages:[
'Tobit era um homem justo que ficou cego e passou por muitas dificuldades. Seu filho Tobias precisava viajar para recuperar um dinheiro da família. Sem saber o caminho, encontrou um companheiro de viagem que se apresentou como Azarias.',
'O companheiro era, na verdade, o anjo Rafael, enviado por Deus. Durante a viagem, Rafael protegeu Tobias e o orientou. Tobias conheceu Sara, que também enfrentava tristezas, e os dois se casaram.',
'Quando voltaram para casa, Rafael ajudou Tobias a cuidar dos olhos do pai, e Tobit recuperou a visão. O anjo revelou sua identidade e ensinou a família a agradecer a Deus. É uma história de proteção, cura e esperança.' ]},
{ id:22,book:'Ester',testament:'Antigo Testamento',title:'A coragem da rainha Ester',ref:'Ester 4–8',emoji:'👸',lesson:'A coragem pode significar defender outras pessoas. Devemos usar nossa voz para proteger quem está em perigo.',pages:[
'Ester era uma jovem judia que se tornou rainha da Pérsia. Seu primo Mardoqueu a orientava e cuidava dela. Um dia, um poderoso conselheiro do rei planejou fazer mal ao povo judeu.',
'Mardoqueu pediu que Ester falasse com o rei, mesmo sabendo que isso poderia ser perigoso. Ester sentiu medo, mas decidiu agir. Pediu que seu povo rezasse e jejuasse com ela antes de se apresentar ao rei.',
'Ester contou a verdade e revelou o plano injusto. O rei ouviu a rainha, e seu povo foi protegido. A história celebra a coragem, a sabedoria e a responsabilidade de defender os inocentes.' ]},
{ id:23,book:'Jó',testament:'Antigo Testamento',title:'Jó e a esperança',ref:'Jó 1–2; 38–42',emoji:'🌤️',lesson:'Quando alguém sofre, precisa de acolhimento, não de julgamentos. Podemos conversar com Deus com sinceridade.',pages:[
'Jó era conhecido por sua retidão. Ele tinha família, amigos e muitos bens, mas enfrentou perdas e sofrimento. Não conseguia entender por que coisas tão difíceis estavam acontecendo.',
'Alguns amigos foram visitá-lo, mas nem sempre souberam consolar. Em vez de apenas escutar, tentaram explicar o sofrimento de Jó como se conhecessem todos os motivos. Jó expressou sua dor e fez perguntas difíceis.',
'A narrativa mostra que a vida tem mistérios que nem sempre compreendemos. Deus se manifesta e convida Jó a reconhecer a grandeza da criação. Jó encontra um novo caminho. A história nos ensina a respeitar quem sofre e a manter a esperança.' ]},
{ id:24,book:'Jonas',testament:'Antigo Testamento',title:'Jonas e o grande peixe',ref:'Jonas 1–4',emoji:'🐋',lesson:'Não devemos fugir de fazer o bem. Deus é misericordioso e nos chama a oferecer novas oportunidades.',pages:[
'Deus pediu ao profeta Jonas que fosse à cidade de Nínive anunciar que seus habitantes precisavam mudar de vida. Jonas não queria ir e embarcou em um navio na direção contrária.',
'Uma grande tempestade atingiu o mar. Jonas reconheceu que estava fugindo de sua missão e foi lançado ao mar, onde um grande peixe o engoliu. Dentro do peixe, Jonas rezou e pediu ajuda. Depois de três dias, foi devolvido à terra.',
'Dessa vez, Jonas foi a Nínive e anunciou a mensagem. O povo mudou de comportamento, e Deus teve misericórdia. Jonas precisou aprender que a compaixão de Deus é maior do que nossos preconceitos.' ]},
{ id:25,book:'Daniel',testament:'Antigo Testamento',title:'Daniel na cova dos leões',ref:'Daniel 6',emoji:'🦁',lesson:'A fé nos dá coragem para fazer o que é certo, mesmo quando é difícil.',pages:[
'Daniel era um homem sábio que servia ao rei. Algumas pessoas tinham inveja dele e convenceram o rei a publicar uma lei injusta: durante certo tempo, ninguém poderia fazer pedidos a outro deus ou pessoa que não fosse o rei.',
'Daniel continuou rezando a Deus, como fazia todos os dias. Por isso foi lançado em uma cova com leões. O rei ficou triste e esperou que Daniel fosse protegido.',
'Na manhã seguinte, Daniel estava vivo e contou que Deus havia enviado seu anjo para fechar a boca dos leões. O rei reconheceu o acontecimento. A história ensina fidelidade, coragem e confiança.' ]},
{ id:26,book:'1 Macabeus',testament:'Antigo Testamento',title:'Judas Macabeu e a coragem do povo',ref:'1 Macabeus 3–4',emoji:'🛡️',lesson:'A fé, a união e a coragem podem inspirar um povo a defender sua liberdade e sua consciência.',pages:[
'Muitos anos depois dos reis antigos, o povo judeu enfrentou um governante que queria proibir seus costumes religiosos. Muitas famílias ficaram assustadas, mas outras decidiram defender sua fé.',
'Judas Macabeu e seus irmãos organizaram a resistência. Eram poucos diante de um exército poderoso, mas mantiveram a esperança e procuraram agir com coragem. Depois de conflitos difíceis, conseguiram recuperar Jerusalém e purificar o Templo.',
'O povo celebrou a dedicação do Templo e manteve viva sua tradição. A história recorda a importância da liberdade religiosa e do respeito à consciência de cada pessoa.' ]},
{ id:27,book:'2 Macabeus',testament:'Antigo Testamento',title:'A coragem dos sete irmãos',ref:'2 Macabeus 7',emoji:'🕯️',lesson:'A fé pode dar força diante de situações muito difíceis. Devemos sempre defender a vida e rejeitar a crueldade.',pages:[
'No tempo da perseguição, uma mãe e seus sete filhos foram pressionados a abandonar a fé. Eles enfrentaram uma situação extremamente cruel por permanecerem fiéis às suas convicções.',
'A mãe demonstrou coragem e encorajou os filhos a não perderem a esperança em Deus. O texto bíblico fala da confiança na ressurreição e na justiça divina, mesmo diante da morte.',
'É uma passagem difícil e deve ser lida com acompanhamento de um adulto. Sua mensagem central é a fidelidade à consciência, a esperança e a dignidade da vida.' ]},
{ id:28,book:'Lucas',testament:'Novo Testamento',title:'O anúncio do anjo a Maria',ref:'Lucas 1,26-38',emoji:'🌟',lesson:'Maria nos ensina a confiar em Deus e a responder com generosidade ao chamado para amar.',pages:[
'Em Nazaré vivia uma jovem chamada Maria. Um dia, o anjo Gabriel foi enviado por Deus e a saudou com palavras de alegria. Maria ficou surpresa e procurou compreender o que estava acontecendo.',
'O anjo anunciou que ela seria a mãe de Jesus, o Filho de Deus. Maria perguntou como isso aconteceria e ouviu a explicação do mensageiro. Mesmo sem entender tudo, confiou em Deus e respondeu que aceitava sua missão.',
'Maria tornou-se um exemplo de fé e disponibilidade. A Igreja Católica a honra de modo especial porque ela aceitou participar da história da salvação e cuidou de Jesus com amor.' ]},
{ id:29,book:'Lucas',testament:'Novo Testamento',title:'O nascimento de Jesus',ref:'Lucas 2,1-20; Mateus 1,18-25',emoji:'👶',lesson:'O Natal celebra que Deus se aproxima de nós. Jesus nasce na simplicidade e nos convida a acolher todos com amor.',pages:[
'José e Maria viajaram até Belém por causa de um recenseamento. Quando chegaram, não encontraram um lugar adequado para ficar. Jesus nasceu em um ambiente simples e foi colocado numa manjedoura, onde os animais se alimentavam.',
'Naquela região, pastores cuidavam de seus rebanhos durante a noite. Um anjo apareceu e anunciou uma grande alegria: havia nascido o Salvador. Os pastores foram até Belém e encontraram Maria, José e o menino Jesus.',
'Eles contaram o que tinham ouvido e voltaram louvando a Deus. Maria guardava aqueles acontecimentos no coração. O nascimento de Jesus ensina que o amor de Deus chega de maneira humilde e transforma o mundo.' ]},
{ id:30,book:'Mateus',testament:'Novo Testamento',title:'Os Reis Magos visitam Jesus',ref:'Mateus 2,1-12',emoji:'🎁',lesson:'Os presentes mais importantes que podemos oferecer são amor, respeito e generosidade.',pages:[
'Alguns sábios do Oriente observaram uma estrela diferente e entenderam que ela anunciava o nascimento de um rei. Começaram uma longa viagem para encontrar o menino e prestar-lhe homenagem.',
'Em Jerusalém, perguntaram onde estava o rei dos judeus. Depois seguiram a estrela até Belém. Encontraram Jesus com Maria e se ajoelharam diante dele. Ofereceram ouro, incenso e mirra, presentes cheios de significado.',
'Em sonho, foram avisados para não voltar a Herodes e escolheram outro caminho para casa. A visita dos Magos recorda que Jesus veio para todos os povos e que devemos procurá-lo com o coração aberto.' ]},
{ id:31,book:'Lucas',testament:'Novo Testamento',title:'Jesus no templo quando menino',ref:'Lucas 2,41-52',emoji:'📖',lesson:'Crescer também é aprender, fazer perguntas e escutar com respeito.',pages:[
'Quando Jesus tinha doze anos, viajou com Maria e José a Jerusalém para a festa da Páscoa. Na hora de voltar, seus pais perceberam que ele não estava entre os parentes e amigos que viajavam juntos.',
'Eles voltaram preocupados e o procuraram por três dias. Encontraram Jesus no Templo, conversando com os mestres, ouvindo e fazendo perguntas. Todos se admiravam de sua inteligência.',
'Maria perguntou por que ele havia feito aquilo. Jesus voltou com seus pais para Nazaré e era obediente a eles. A Bíblia diz que crescia em sabedoria, idade e graça diante de Deus e das pessoas.' ]},
{ id:32,book:'Mateus',testament:'Novo Testamento',title:'O batismo de Jesus',ref:'Mateus 3,13-17',emoji:'🕊️',lesson:'O batismo nos lembra que somos amados por Deus e chamados a viver como seus filhos.',pages:[
'João Batista anunciava a chegada do Reino de Deus e convidava as pessoas a mudar de vida. Ele batizava no rio Jordão. Um dia, Jesus foi até ele e pediu para ser batizado.',
'João ficou surpreso, mas Jesus explicou que aquele gesto fazia parte de sua missão. Quando Jesus saiu da água, os céus se abriram e o Espírito de Deus desceu como uma pomba. Uma voz declarou que Jesus era o Filho amado.',
'Esse acontecimento marca o início da vida pública de Jesus. Para os cristãos, é uma revelação importante de sua identidade e da presença do Pai, do Filho e do Espírito Santo.' ]},
{ id:33,book:'João',testament:'Novo Testamento',title:'As bodas de Caná',ref:'João 2,1-11',emoji:'🍇',lesson:'Maria nos ensina a perceber as necessidades dos outros. Jesus transforma a alegria e cuida das pessoas.',pages:[
'Jesus, Maria e alguns discípulos foram convidados para uma festa de casamento em Caná da Galileia. Durante a celebração, o vinho acabou, o que poderia causar grande constrangimento aos noivos.',
'Maria percebeu o problema e contou a Jesus. Depois disse aos servidores: “Fazei tudo o que ele vos disser”. Jesus pediu que enchessem de água grandes talhas usadas para a purificação.',
'Quando o responsável pela festa provou a água, ela havia se transformado em vinho de excelente qualidade. Esse foi o primeiro sinal de Jesus narrado no Evangelho de João e mostrou sua glória aos discípulos.' ]},
{ id:34,book:'Marcos',testament:'Novo Testamento',title:'Jesus acalma a tempestade',ref:'Marcos 4,35-41',emoji:'⛵',lesson:'Quando sentimos medo, podemos pedir ajuda. Jesus ensina confiança e paz.',pages:[
'Jesus e seus discípulos entraram em um barco para atravessar o lago. Jesus estava cansado e adormeceu. De repente, começou uma tempestade, e as ondas batiam com força contra o barco.',
'Os discípulos ficaram apavorados e acordaram Jesus: “Mestre, não te importa que pereçamos?”. Jesus levantou-se, falou ao vento e ao mar, e a tempestade se acalmou.',
'Então perguntou por que estavam com tanto medo. Os discípulos ficaram admirados e se perguntaram quem era aquele a quem até o vento e o mar obedeciam. A história convida a confiar em Deus nos momentos difíceis.' ]},
{ id:35,book:'João',testament:'Novo Testamento',title:'A multiplicação dos pães e peixes',ref:'João 6,1-15',emoji:'🍞',lesson:'Partilhar o que temos pode fazer a diferença. A generosidade começa com pequenos gestos.',pages:[
'Uma grande multidão seguia Jesus para ouvir seus ensinamentos. As pessoas estavam longe de casa e começaram a sentir fome. Jesus perguntou a Filipe onde poderiam comprar pão para todos.',
'Um menino tinha cinco pães de cevada e dois peixinhos. Era pouco para tanta gente, mas ele colocou o que tinha à disposição. Jesus agradeceu a Deus e distribuiu os alimentos. Todos comeram até ficar satisfeitos.',
'Os discípulos recolheram os pedaços que sobraram, enchendo doze cestos. O sinal mostrou o cuidado de Jesus e a importância de partilhar. Na tradição católica, essa passagem também ajuda a compreender o significado do pão na vida cristã.' ]},
{ id:36,book:'Lucas',testament:'Novo Testamento',title:'O bom samaritano',ref:'Lucas 10,25-37',emoji:'❤️',lesson:'Próximo é quem precisa de ajuda. Amar é agir com compaixão, sem escolher quem merece cuidado.',pages:[
'Um homem perguntou a Jesus quem era seu próximo. Para responder, Jesus contou a história de um viajante que foi assaltado e ficou ferido à beira do caminho.',
'Um sacerdote passou por ali e seguiu adiante. Depois, um levita também passou e não parou. Então chegou um samaritano, alguém de um povo com quem muitos judeus não se davam bem. Ele sentiu compaixão, cuidou das feridas e colocou o homem em seu animal.',
'O samaritano levou o ferido a uma hospedaria e pagou para que cuidassem dele. Jesus perguntou quem havia sido o próximo daquele homem. A resposta era clara: aquele que teve misericórdia. Jesus concluiu: vai e faze o mesmo.' ]},
{ id:37,book:'Lucas',testament:'Novo Testamento',title:'O filho pródigo',ref:'Lucas 15,11-32',emoji:'🏡',lesson:'Deus é como um Pai misericordioso. Podemos voltar, pedir perdão e recomeçar.',pages:[
'Jesus contou a história de um pai que tinha dois filhos. O mais novo pediu sua parte da herança e foi embora para uma terra distante. Gastou tudo e, quando veio uma grande fome, ficou sem dinheiro e sem amigos.',
'Com fome e arrependido, decidiu voltar para casa. Pensou em pedir ao pai que o recebesse como empregado. Mas, quando ainda estava longe, o pai o viu, correu ao seu encontro e o abraçou com alegria.',
'O pai preparou uma festa para celebrar o retorno do filho. O irmão mais velho ficou zangado, mas o pai explicou que era justo alegrar-se porque aquele que estava perdido havia sido encontrado. Jesus ensina a misericórdia e a alegria do perdão.' ]},
{ id:38,book:'Lucas',testament:'Novo Testamento',title:'Zaqueu, o cobrador de impostos',ref:'Lucas 19,1-10',emoji:'🌳',lesson:'Sempre podemos mudar. Um encontro verdadeiro com Jesus inspira reparação e generosidade.',pages:[
'Zaqueu era chefe dos cobradores de impostos e tinha ficado rico. Muitas pessoas não gostavam dele, pois os cobradores eram conhecidos por cobrar injustamente. Quando Jesus passou por Jericó, Zaqueu queria vê-lo, mas era baixinho e a multidão atrapalhava.',
'Então correu adiante e subiu em uma árvore. Jesus olhou para cima, chamou Zaqueu pelo nome e disse que ficaria em sua casa. Zaqueu desceu depressa, muito feliz, e recebeu Jesus.',
'Diante de Jesus, Zaqueu decidiu repartir seus bens com os pobres e devolver muito mais a quem tivesse prejudicado. Jesus declarou que a salvação havia chegado àquela casa. O encontro transformou a vida de Zaqueu.' ]},
{ id:39,book:'João',testament:'Novo Testamento',title:'Jesus e as crianças',ref:'Marcos 10,13-16',emoji:'🧒',lesson:'Toda criança tem dignidade e merece amor, atenção e respeito. Jesus acolhe os pequenos.',pages:[
'Algumas pessoas levaram crianças até Jesus para que ele as abençoasse. Os discípulos tentaram impedir, talvez pensando que Jesus estava ocupado com assuntos mais importantes.',
'Jesus não gostou daquela atitude. Chamou as crianças para perto e disse que o Reino de Deus pertence aos que são como elas. Acolheu cada uma e as abençoou.',
'Esse gesto mostra o carinho de Jesus pelas crianças. Na Igreja, essa passagem recorda que os pequenos devem ser acolhidos, protegidos e respeitados.' ]},
{ id:40,book:'João',testament:'Novo Testamento',title:'A ressurreição de Lázaro',ref:'João 11,1-44',emoji:'🌅',lesson:'Jesus é fonte de vida e esperança. Podemos acompanhar com carinho quem está triste.',pages:[
'Lázaro e suas irmãs, Marta e Maria, eram amigos de Jesus. Quando Lázaro ficou muito doente, as irmãs mandaram avisar Jesus. Mas ele chegou quando Lázaro já havia morrido e sido colocado em um túmulo.',
'Marta foi ao encontro de Jesus e falou de sua tristeza. Jesus chorou com os amigos e mostrou que também sentia a dor da perda. Depois foi até o túmulo e pediu que retirassem a pedra.',
'Jesus chamou Lázaro para fora, e ele saiu vivo. Muitas pessoas acreditaram ao ver o sinal. A história anuncia a esperança cristã na vida que Deus oferece e mostra que Jesus se aproxima de quem sofre.' ]},
{ id:41,book:'Mateus',testament:'Novo Testamento',title:'A entrada de Jesus em Jerusalém',ref:'Mateus 21,1-11',emoji:'🌿',lesson:'Jesus é um rei diferente: humilde, pacífico e próximo das pessoas.',pages:[
'Jesus aproximou-se de Jerusalém montado em um jumentinho. Não chegou em um cavalo de guerra nem com soldados. Sua entrada mostrava humildade e paz.',
'Muitas pessoas estenderam mantos pelo caminho e cortaram ramos das árvores. A multidão o saudava com alegria, dizendo “Hosana!”. Reconheciam em Jesus aquele que vinha em nome do Senhor.',
'Esse acontecimento é lembrado no Domingo de Ramos, que inicia a Semana Santa. A Igreja convida os fiéis a acompanhar Jesus em sua entrega de amor.' ]},
{ id:42,book:'Mateus',testament:'Novo Testamento',title:'A Última Ceia',ref:'Mateus 26,17-30; Lucas 22,14-20',emoji:'🍷',lesson:'Jesus ensina a servir, amar e partilhar. A Eucaristia é o centro da vida da Igreja Católica.',pages:[
'Na noite antes de sua paixão, Jesus reuniu os discípulos para celebrar a Páscoa. Durante a refeição, tomou o pão, deu graças, partiu-o e entregou aos discípulos, dizendo que era seu corpo. Depois tomou o cálice e falou da nova aliança em seu sangue.',
'Jesus também ensinou que o maior deve ser aquele que serve. No Evangelho de João, lavou os pés dos discípulos, realizando um gesto de humildade e cuidado.',
'Os católicos celebram esse mistério na Eucaristia, especialmente na Santa Missa. A Última Ceia recorda que Jesus permanece com sua Igreja e nos chama a viver em comunhão e serviço.' ]},
{ id:43,book:'Mateus',testament:'Novo Testamento',title:'A Paixão e morte de Jesus',ref:'Mateus 26–27; Marcos 14–15; Lucas 22–23; João 18–19',emoji:'✝️',lesson:'A cruz revela o amor de Jesus, que se entrega por todos. A história deve ser lida com sensibilidade e acompanhamento adulto.',pages:[
'Depois da Última Ceia, Jesus foi ao Jardim das Oliveiras para rezar. Ali enfrentou angústia e tristeza, mas permaneceu fiel à sua missão. Foi preso e levado diante das autoridades. Seus amigos ficaram assustados e alguns fugiram.',
'Jesus foi condenado e levado ao Calvário. No caminho, sofreu muito. Na cruz, rezou e perdoou. Sua mãe Maria e alguns discípulos permaneceram próximos. Jesus morreu, e seus amigos colocaram seu corpo em um túmulo.',
'Para os cristãos, a morte de Jesus não é o fim da história. Ela revela um amor que não abandona a humanidade. A Igreja recorda esses acontecimentos na Sexta-feira Santa, com respeito e oração.' ]},
{ id:44,book:'Mateus',testament:'Novo Testamento',title:'A ressurreição de Jesus',ref:'Mateus 28; Marcos 16; Lucas 24; João 20',emoji:'🌅',lesson:'A Páscoa é a grande festa da esperança: o amor de Deus é mais forte que a morte.',pages:[
'No primeiro dia da semana, algumas mulheres foram ao túmulo de Jesus. Encontraram a pedra removida e o túmulo vazio. Um anjo anunciou que Jesus havia ressuscitado, como tinha prometido.',
'Maria Madalena e outras mulheres foram contar a notícia aos discípulos. Depois, Jesus apareceu a seus seguidores. Aos poucos, o medo deu lugar à alegria, e eles compreenderam que a vida havia vencido a morte.',
'A ressurreição é o centro da fé cristã. Os católicos celebram a Páscoa com grande alegria, porque acreditam que Jesus está vivo e abre para todos o caminho da vida eterna.' ]},
{ id:45,book:'Atos dos Apóstolos',testament:'Novo Testamento',title:'A ascensão de Jesus',ref:'Atos 1,1-11',emoji:'☁️',lesson:'Jesus confia aos discípulos a missão de anunciar o amor de Deus em todos os lugares.',pages:[
'Depois de ressuscitar, Jesus apareceu aos discípulos durante quarenta dias e falou sobre o Reino de Deus. Eles ainda tinham muitas perguntas e queriam saber quando tudo aconteceria.',
'Jesus prometeu que receberiam a força do Espírito Santo e seriam suas testemunhas em Jerusalém, na Judeia, na Samaria e até os confins da terra. Depois foi elevado ao céu, e uma nuvem o encobriu.',
'Os discípulos voltaram para Jerusalém com esperança. A Ascensão não significava abandono: Jesus confiava a eles uma missão e prometia permanecer com sua comunidade.' ]},
{ id:46,book:'Atos dos Apóstolos',testament:'Novo Testamento',title:'Pentecostes: a vinda do Espírito Santo',ref:'Atos 2,1-13',emoji:'🔥',lesson:'O Espírito Santo nos inspira a falar com coragem, construir a paz e viver unidos apesar das diferenças.',pages:[

</script><script>
const view=document.getElementById('view'),back=document.getElementById('back');let page='home',previous='home',current=null,part=0;let favorites=[];try{favorites=JSON.parse(localStorage.getItem('biblia-favs')||'[]');if(!Array.isArray(favorites))favorites=[];}catch(e){favorites=[];}const save=()=>{try{localStorage.setItem('biblia-favs',JSON.stringify(favorites));}catch(e){}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(p){previous=page;page=p;render()}function home(){page='home';render()}function openStory(id){current=STORIES.find(s=>s.id===id);part=0;previous=page;page='reader';render()}function storyCard(s){return `<button class="story-card" onclick="openStory(${s.id})"><div class="story-emoji">${s.emoji}</div><div><strong>${esc(s.title)}</strong><small>${esc(s.ref)} · ${esc(s.book)}</small></div><span class="arrow">›</span></button>`}function listStories(arr){return `<div class="story-list">${arr.map(storyCard).join('')}</div>`}
function render(){back.classList.toggle('hidden',page==='home');document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===page));if(page==='reader'){renderReader();return}if(page==='home'){view.innerHTML=`<section class="hero"><div class="hero-copy"><span class="pill">✨ PARA CRIANÇAS DE 6 A 10 ANOS</span><h1>Grandes histórias.<br>Pequenos corações.</h1><p>Descubra a Bíblia e aprenda sobre o amor de Deus!</p><button class="primary" onclick="go('old')">Começar a ler →</button></div><div class="hero-art" role="img" aria-label="Ilustração infantil">👨‍👧‍👦✨</div></section><h2 class="section-title">Escolha sua aventura 📚</h2><div class="grid"><button class="test-card old" onclick="go('old')"><span>📜</span><strong>Antigo Testamento</strong><small>As histórias do povo de Deus</small></button><button class="test-card new" onclick="go('new')"><span>✝️</span><strong>Novo Testamento</strong><small>A vida de Jesus e da Igreja</small></button></div><div class="tools"><button class="tool" onclick="go('favorites')"><span>⭐</span>Favoritos</button><button class="tool" onclick="go('search')"><span>🔎</span>Buscar histórias</button><button class="tool" onclick="go('about')"><span>💛</span>Sobre o app</button></div><div class="quote">“Deixai vir a mim as crianças.”<br><small>Mateus 19,14</small></div><h2 class="section-title">🌟 Uma história para hoje</h2>${storyCard(STORIES[(new Date().getDate())%STORIES.length])}`;return}
if(page==='old'||page==='new'){let t=page==='old'?'Antigo Testamento':'Novo Testamento';view.innerHTML=`<div class="tag">Explore as escrituras</div><h1 class="section-title" style="font-size:25px;margin-top:5px">${page==='old'?'📜':'✝️'} ${t}</h1><p style="color:#65758a;margin-top:-5px">${STORIES.filter(s=>s.testament===t).length} histórias para conhecer e aprender.</p>${listStories(STORIES.filter(s=>s.testament===t))}`;return}
if(page==='favorites'){let arr=STORIES.filter(s=>favorites.includes(s.id));view.innerHTML=`<div class="tag">Suas histórias especiais</div><h1 class="section-title" style="font-size:25px;margin-top:5px">⭐ Meus favoritos</h1>${arr.length?listStories(arr):'<div class="empty"><div style="font-size:48px">⭐</div><strong>Você ainda não salvou histórias.</strong><p>Toque no coração de uma história para guardá-la aqui.</p></div>'}`;return}
if(page==='search'){view.innerHTML=`<div class="tag">Encontre sua história</div><h1 class="section-title" style="font-size:25px;margin-top:5px">🔎 Buscar histórias</h1><input id="q" class="search" placeholder="Digite um nome ou personagem..." autocomplete="off"><div id="results">${listStories(STORIES.slice(0,8))}</div>`;document.getElementById('q').addEventListener('input',e=>{let q=e.target.value.toLocaleLowerCase('pt-BR');let arr=STORIES.filter(s=>(s.title+' '+s.book+' '+s.ref+' '+s.lesson).toLocaleLowerCase('pt-BR').includes(q));document.getElementById('results').innerHTML=arr.length?listStories(arr):'<div class="empty">Não encontramos essa história. Tente outro nome. 💛</div>'});return}
if(page==='about'){view.innerHTML=`<div class="about"><div style="font-size:42px;text-align:center">📖✨</div><h1 style="text-align:center">Minha Bíblia Infantil</h1><p>Um espaço especial para crianças de 6 a 10 anos conhecerem as histórias da Bíblia Católica com linguagem acolhedora, ilustrações e ensinamentos para o dia a dia.</p><h3>📚 Conteúdo</h3><p>As histórias são narrativas infantis originais baseadas nas passagens bíblicas indicadas. Não são uma transcrição integral de uma tradução bíblica específica.</p><h3>⛪ Tradição católica</h3><p>A seleção considera o cânon católico, incluindo referências a livros deuterocanônicos, como Tobias, Judite, Sabedoria, Eclesiástico, Baruc e 1 e 2 Macabeus. Esta primeira edição já inclui histórias de Tobias e Macabeus; outras histórias poderão ser acrescentadas em atualizações.</p><h3>💡 Para famílias</h3><p>Algumas passagens apresentam conflitos e sofrimento. Recomendamos a leitura acompanhada por um adulto, que poderá conversar com a criança e responder às suas perguntas.</p><h3>📵 Funciona offline</h3><p>Depois de instalado, o aplicativo guarda as histórias e os favoritos no próprio aparelho. Não exige cadastro e não coleta dados pessoais.</p><p style="text-align:center;color:#8290a0;font-size:12px">Versão 1.0 · Conteúdo em português brasileiro</p></div>`;return}}
function renderReader(){let s=current;let fav=favorites.includes(s.id);view.innerHTML=`<div class="reader-head"><div class="bigemoji">${s.emoji}</div><div class="tag" style="color:#d8ebff">${esc(s.testament)} · ${esc(s.book)}</div><h2>${esc(s.title)}</h2><small>📖 ${esc(s.ref)}</small></div><div class="page-text"><p>${esc(s.pages[part])}</p></div><div class="reader-controls"><button class="navbtn" id="prev" ${part===0?'disabled':''}>← Anterior</button><span class="counter">Parte ${part+1} de ${s.pages.length}</span><button class="navbtn" id="next">${part===s.pages.length-1?'Lição':'Próximo →'}</button></div><button class="favorite" id="fav">${fav?'♥ Remover dos favoritos':'♡ Salvar nos favoritos'}</button>${part===s.pages.length-1?`<div class="lesson"><strong>💡 O que aprendemos?</strong>${esc(s.lesson)}</div><button class="primary" style="width:100%;margin-top:15px" id="finish">Concluir história ✓</button>`:''}`;document.getElementById('prev').onclick=()=>{if(part>0){part--;renderReader()}};document.getElementById('next').onclick=()=>{if(part<s.pages.length-1){part++;renderReader()}else{document.querySelector('.lesson').scrollIntoView({behavior:'smooth',block:'center'})}};document.getElementById('fav').onclick=()=>{favorites=fav?favorites.filter(x=>x!==s.id):[...favorites,s.id];save();renderReader()};let f=document.getElementById('finish');if(f)f.onclick=()=>{page=s.testament==='Antigo Testamento'?'old':'new';render()}}
back.onclick=()=>{if(page==='reader'){page=previous==='reader'?'home':previous}else page='home';render()};document.getElementById('homeTop').onclick=home;document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>go(b.dataset.tab));if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));if(!window.STORIES||!window.STORIES.length){view.innerHTML='<div class="about"><h2>As histórias não foram carregadas</h2><p>Feche e abra novamente este arquivo no navegador.</p></div>';}else{render();}
</script></body></html>
