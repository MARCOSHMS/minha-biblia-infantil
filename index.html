<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1262cf"><meta name="description" content="Histórias da Bíblia Católica ilustradas para crianças de 6 a 10 anos."><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icon.svg"><title>Minha Bíblia Infantil</title><style>
:root{--blue:#1262cf;--blue2:#0c49a5;--gold:#ffca54;--cream:#fff6df;--ink:#18345c;--green:#27ad63;--pink:#f36b92}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff4ff,#f9f5e9 48%,#e4f7dc);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;min-height:100vh;background:rgba(255,255,255,.45);padding-bottom:88px}.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#1262cf,#0b49a5);color:white;padding:15px 18px;box-shadow:0 3px 14px #174a8b35;display:flex;align-items:center;gap:12px}.brand{font-weight:900;font-size:19px;letter-spacing:-.4px;flex:1}.brand small{display:block;font-size:10px;font-weight:600;opacity:.85;letter-spacing:1.1px}.top button{background:#ffffff22;color:white;border-radius:12px;padding:9px 12px;font-weight:800}.content{padding:17px}.hero{border-radius:25px;overflow:hidden;background:linear-gradient(135deg,#1675e9,#68c9ff);color:white;box-shadow:0 9px 22px #1556a52c;position:relative;min-height:228px;display:flex;align-items:center}.hero-copy{padding:22px 14px 22px 22px;max-width:62%;position:relative;z-index:1}.hero h1{font-size:26px;line-height:1.08;margin:0 0 10px;text-shadow:0 2px 3px #073b84}.hero p{font-weight:650;font-size:14px;margin:0 0 15px}.pill{display:inline-block;background:#ffdb71;color:#70410a;padding:7px 12px;border-radius:20px;font-size:11px;font-weight:900;margin-bottom:8px}.primary{background:linear-gradient(180deg,#ffdb63,#ffad27);color:#643b05;border-radius:18px;padding:12px 18px;font-weight:900;box-shadow:0 4px 0 #d78c1d}.section-title{font-size:19px;font-weight:900;margin:23px 2px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.test-card{border-radius:20px;padding:17px;color:white;min-height:142px;box-shadow:0 5px 12px #1c4a7420;position:relative;overflow:hidden;text-align:left}.test-card strong{display:block;font-size:17px;max-width:85%;line-height:1.12}.test-card span{font-size:38px;display:block;margin-bottom:7px}.test-card small{display:block;margin-top:8px;opacity:.92;font-weight:650}.old{background:linear-gradient(145deg,#1684e9,#0644a7)}.new{background:linear-gradient(145deg,#9864e8,#5830b6)}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.tool{background:white;border-radius:17px;padding:14px 8px;text-align:center;box-shadow:0 3px 10px #294b6714;color:var(--ink);font-weight:800;font-size:12px}.tool span{font-size:26px;display:block;margin-bottom:5px}.quote{margin-top:18px;padding:16px;border-radius:18px;background:#fff5d7;border:1px solid #f2d58c;text-align:center;font-weight:750;color:#80531b}.story-list{display:grid;gap:10px}.story-card{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #f1dfb8;border-radius:17px;padding:11px;text-align:left;box-shadow:0 3px 9px #614c1a0c;color:var(--ink);width:100%;transition:transform .12s}.story-card:active{transform:scale(.99)}.story-emoji{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-size:32px;background:linear-gradient(145deg,#e0f3ff,#fff0c8);flex-shrink:0;position:relative;overflow:hidden}.story-card strong{display:block;font-size:15px}.story-card small{display:block;color:#65758a;margin-top:3px;font-size:12px}.arrow{margin-left:auto;font-size:22px;color:#2870c6}.search{width:100%;border:2px solid #d5e6f6;border-radius:16px;padding:13px 15px;background:white;outline:none;margin-bottom:14px}.search:focus{border-color:#3989df}.reader-head{border-radius:22px;background:linear-gradient(135deg,#167de5,#0b4fae);color:white;padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;gap:14px}.reader-head .bigemoji{font-size:44px;flex-shrink:0}.reader-head h2{margin:4px 0;font-size:21px;line-height:1.15}.reader-head small{opacity:.9}.story-art{border-radius:20px;overflow:hidden;margin-bottom:14px;border:2px solid #e6d7b5;box-shadow:0 6px 16px #18345c18;background:#fff}.story-art svg{display:block;width:100%;height:auto}.page-dots{display:flex;justify-content:center;gap:6px;margin-bottom:12px}.page-dots span{height:8px;width:8px;border-radius:99px;background:#cbd9ea;transition:all .2s}.page-dots span.on{width:24px;background:var(--blue)}.page-text{background:#fffaf0;border:1px solid #efdcae;border-radius:20px;padding:20px 18px;box-shadow:0 5px 16px #6c4a1418;font-size:17px;line-height:1.82;color:#3d3122;min-height:190px}.page-text p{margin:0}.reader-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.navbtn{background:var(--blue);color:white;padding:12px 16px;border-radius:14px;font-weight:850}.navbtn:disabled{opacity:.35}.counter{font-weight:850;color:#52677e;font-size:13px}.lesson{background:#e8f8e9;border:1px solid #bce5c0;padding:17px;border-radius:18px;margin-top:15px;color:#205a35;line-height:1.6}.lesson strong{display:block;margin-bottom:5px}.favorite{background:#fff0f4;color:#a92f57;border-radius:13px;padding:10px 14px;font-weight:850;margin-top:13px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;box-shadow:0 -4px 18px #163b671c;padding:8px 7px max(8px,env(safe-area-inset-bottom));z-index:6}.bottom button{background:transparent;color:#718095;font-size:10px;font-weight:800;padding:4px}.bottom button span{display:block;font-size:21px;margin-bottom:2px}.bottom button.active{color:#1262cf}.empty{text-align:center;padding:35px 12px;color:#6c7c8f}.about{background:white;border-radius:20px;padding:18px;line-height:1.65}.tag{font-size:10px;color:#42658b;font-weight:900;letter-spacing:.8px;text-transform:uppercase}.hidden{display:none!important}@media(min-width:600px){.content{padding:24px}.hero{min-height:260px}.hero h1{font-size:33px}.story-list{grid-template-columns:1fr 1fr}.page-text{font-size:19px}}
.hero-art{position:absolute;right:6px;bottom:0;width:42%;height:100%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}

.story-art-container {
    position: relative;
    cursor: zoom-in;
    margin-bottom: 14px;
    border-radius: 20px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}
.story-art-container .story-art {
    margin-bottom: 0;
}
.story-img {
    width: 100%;
    height: auto;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
    border-radius: 20px;
    border: 2px solid #e6d7b5;
    box-shadow: 0 6px 16px #18345c18;
    background: #fdfaf3;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.story-art-container:active .story-img,
.story-art-container:active .story-art {
    transform: scale(0.99);
}
.zoom-badge {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: rgba(15, 38, 70, 0.78);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    padding: 6px 12px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    gap: 5px;
    pointer-events: none;
    box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    z-index: 2;
}

/* Modal Lightbox Fullscreen (Retrato e Paisagem + Zoom com arraste) */
.img-lightbox {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    background: rgba(8, 18, 34, 0.95);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.22s ease, visibility 0.22s ease;
    backdrop-filter: blur(6px);
}
.img-lightbox.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}
.lightbox-topbar {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10002;
}
.lightbox-btn {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    border: 1.5px solid rgba(255, 255, 255, 0.38);
    height: 44px;
    min-width: 44px;
    padding: 0 14px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    backdrop-filter: blur(6px);
}
.lightbox-btn:active {
    transform: scale(0.95);
}
.lightbox-stage {
    flex: 1;
    width: 100%;
    height: 100%;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y pinch-zoom;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(62px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom)) 12px;
}
.img-lightbox.zoomed .lightbox-stage {
    align-items: flex-start;
    justify-content: flex-start;
    padding: 64px 16px 32px 16px;
}
.lightbox-media-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto;
}
.img-lightbox img {
    max-width: 95vw;
    max-height: 76dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
    border: 2px solid rgba(255, 255, 255, 0.2);
    cursor: zoom-in;
    display: block;
}
.img-lightbox.zoomed img {
    max-width: none;
    max-height: none;
    width: 175vw;
    cursor: zoom-out;
}
.lightbox-svg-box {
    width: 94vw;
    max-width: 820px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
    border: 2px solid rgba(255, 255, 255, 0.2);
    cursor: zoom-in;
}
.lightbox-svg-box .story-art {
    margin-bottom: 0;
    border: 0;
    border-radius: 0;
}
.img-lightbox.zoomed .lightbox-svg-box {
    width: 175vw;
    max-width: none;
    cursor: zoom-out;
}
.lightbox-caption {
    color: #f8fafc;
    font-size: 14px;
    font-weight: 800;
    text-align: center;
    margin-top: 12px;
    padding: 0 16px;
    max-width: 92vw;
}
.lightbox-hint {
    color: #94a3b8;
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    margin-top: 4px;
}
@media (orientation: landscape) {
    .lightbox-stage {
        padding: 12px 16px;
    }
    .img-lightbox img {
        max-width: 92vw;
        max-height: 82dvh;
        border-radius: 12px;
    }
    .img-lightbox.zoomed img {
        width: auto;
        height: 165dvh;
    }
    .lightbox-svg-box {
        width: min(88vw, 145dvh);
        max-width: none;
    }
    .img-lightbox.zoomed .lightbox-svg-box {
        width: 165vw;
    }
    .lightbox-caption {
        margin-top: 6px;
        font-size: 12px;
    }
    .lightbox-hint {
        display: none;
    }
}
</style></head><body><div class="app"><header class="top"><button id="back" class="hidden" aria-label="Voltar">←</button><div class="brand">📖 Minha Bíblia Infantil<small>CONHEÇA • APRENDA • VIVA O AMOR DE DEUS</small></div><button id="homeTop" aria-label="Início">⌂</button></header><main id="view" class="content"></main><nav class="bottom"><button data-tab="home" class="active"><span>🏡</span>Início</button><button data-tab="favorites"><span>⭐</span>Favoritos</button><button data-tab="search"><span>🔎</span>Buscar</button><button data-tab="about"><span>💛</span>Sobre</button></nav></div><script>
// Narrativas infantis ilustradas baseadas nas passagens bíblicas da tradição católica.
window.STORIES = [{"id":1,"book":"Gênesis","testament":"Antigo Testamento","title":"A criação do mundo","ref":"Gênesis 1–2","emoji":"🌍","lesson":"A criação é um presente de Deus. Podemos cuidar da natureza, dos animais e de todas as pessoas.","pages":["No começo de tudo, antes de existir o céu azul, as nuvens fofas, as montanhas altas, os oceanos e até mesmo o tempo, só existia Deus, cheio de amor e luz. A terra ainda era vazia, escura e coberta por águas profundas. Então Deus decidiu criar um universo maravilhoso, onde a vida pudesse florescer e ser feliz.","Com sua palavra poderosa e cheia de carinho, Deus disse: “Haja luz!”. Naquele instante, uma claridade brilhante iluminou tudo, e Deus separou o dia luminoso da noite tranquila. No segundo dia, Deus formou o imenso céu azul acima das águas. No terceiro dia, reuniu os mares e fez surgir a terra seca, cobrindo os campos com grama verdinha, flores perfumadas e árvores carregadas de frutas saborosas.","No quarto dia, Deus enfeitou o céu: colocou o sol dourado para aquecer e iluminar o dia, e a lua prateada junto com milhões de estrelas cintilantes para brilhar na noite. No quinto dia, encheu os mares e rios de peixes coloridos, baleias gigantes e golfinhos saltitantes, enquanto milhares de pássaros passaram a voar e cantar pelos ares.","No sexto dia, Deus criou todos os animais da terra: leões majestosos, coelhinhos saltitantes, elefantes, borboletas e cachorrinhos. Por fim, como sua obra mais especial, Deus criou o ser humano — homem e mulher — à sua própria imagem e semelhança, capazes de amar, pensar e cuidar de toda a criação como bons amigos de Deus.","Deus olhou para tudo o que havia criado e viu que era muito bom! No sétimo dia, Deus descansou e abençoou aquele dia, ensinando que todos nós também precisamos de momentos para parar, descansar, brincar em família e agradecer por todas as maravilhas que recebemos."],"scene":"creation"},{"id":2,"book":"Gênesis","testament":"Antigo Testamento","title":"Adão e Eva no jardim","ref":"Gênesis 2–3","emoji":"🌳","lesson":"Deus nos dá liberdade e nos ensina a escolher o bem. Quando erramos, podemos reconhecer o erro e buscar o caminho certo.","pages":["Depois de criar o mundo inteiro, Deus plantou um jardim extraordinário chamado Éden, no Oriente. Era um lugar cheio de paz, onde rios cristalinos corriam entre flores de todas as cores, árvores frondosas davam sombra fresca e todos os animais viviam em harmonia sem medo uns dos outros.","Ali viviam Adão e Eva, os primeiros seres humanos. Deus conversava com eles como um amigo próximo e lhes deu uma tarefa muito bonita: cuidar daquele jardim, dar nome aos animais e aproveitar com alegria todos os frutos saborosos que cresciam ali.","Deus explicou que eles podiam comer livremente de quase todas as árvores, mas pediu que respeitassem uma única regra: não deveriam comer o fruto da árvore do conhecimento do bem e do mal. Esse limite era um convite para que escolhessem amar e confiar em Deus livremente.","Um dia, porém, uma serpente astuta aproximou-se de Eva e começou a colocar dúvidas em seu coração, dizendo que Deus estava escondendo algo bom deles. Eva olhou para o fruto, achou-o bonito e decidiu comê-lo, oferecendo-o também a Adão, que aceitou e comeu.","Logo perceberam que haviam quebrado a confiança com Deus e sentiram vergonha e medo. Quando Deus os chamou, tiveram de deixar o jardim do Éden para enfrentar os desafios da vida fora dali. Mesmo assim, Deus cuidou deles, fez roupas para protegê-los e prometeu que nunca os abandonaria."],"scene":"eden"},{"id":3,"book":"Gênesis","testament":"Antigo Testamento","title":"Caim e Abel","ref":"Gênesis 4","emoji":"🌾","lesson":"A inveja e a raiva podem machucar. Deus nos chama a cuidar uns dos outros e resolver conflitos com amor.","pages":["Fora do jardim do Éden, Adão e Eva formaram sua família e tiveram dois filhos: Caim, o mais velho, que aprendeu a arar a terra e plantar sementes, e Abel, o mais novo, que se tornou pastor e cuidava com carinho de um rebanho de ovelhas.","Os dois irmãos cresceram e, um dia, decidiram apresentar ofertas de agradecimento a Deus pelo fruto de seu trabalho. Abel escolheu com generosidade e amor as melhores ovelhinhas de seu rebanho, enquanto Caim trouxe alguns frutos de sua colheita sem o mesmo cuidado no coração.","Deus acolheu com alegria a oferta sincera de Abel, mas Caim ficou profundamente irritado e deixou a inveja tomar conta de seus pensamentos. Percebendo a tristeza e a raiva no rosto de Caim, Deus conversou com ele com paciência, avisando que ele precisava dominar aqueles sentimentos ruins antes que causassem um mal maior.","Infelizmente, Caim não escutou o conselho de Deus. Em vez de conversar com o irmão ou pedir ajuda para acalmar o coração, chamou Abel para o campo e, tomado pela raiva, acabou tirando a vida do próprio irmão.","Quando Deus perguntou onde estava Abel, Caim percebeu a gravidade do que tinha feito e teve de partir para longe. Essa história nos ensina que a vida de cada pessoa é sagrada e que, quando sentimos ciúme ou raiva, devemos conversar, respirar fundo e pedir ajuda para não machucar quem amamos."],"scene":"fields"},{"id":4,"book":"Gênesis","testament":"Antigo Testamento","title":"Noé e a grande arca","ref":"Gênesis 6–9","emoji":"🛶","lesson":"A fidelidade, a coragem e o cuidado com a vida são importantes. O arco-íris recorda a aliança de Deus com a criação.","pages":["Muitos anos se passaram, e a humanidade cresceu por toda a terra. Infelizmente, quase todas as pessoas haviam se esquecido de Deus e tratavam umas às outras com egoísmo e violência. No meio de tudo isso, havia um homem bom e justo chamado Noé, que caminhava com Deus e ensinava sua família a praticar o bem.","Um dia, Deus falou ao coração de Noé: “Vou enviar um grande dilúvio sobre a terra para renovar o mundo. Construa uma arca bem grande de madeira, com três andares e espaço suficiente para sua família e para os animais”. Mesmo morando longe do mar, Noé obedeceu com fé e começou a trabalhar junto com seus filhos.","As pessoas ao redor riam e não entendiam por que Noé construía um barco tão gigantesco em terra firme. Mas Noé perseverou até terminar cada detalhe. Então, guiados por Deus, pares de todos os animais — leões, girafas, passarinhos, tartarugas e coelhos — entraram tranquilamente na arca junto com Noé e sua família.","Deus fechou a porta da arca por fora, e logo começou a chover sem parar durante quarenta dias e quarenta noites. As águas subiram até cobrir as montanhas mais altas, mas dentro da arca todos estavam seguros, quentinhos e bem cuidados por Noé.","Quando a chuva finalmente cessou e as águas baixaram, Noé soltou uma pomba que voltou trazendo um raminho verde de oliveira no bico! Todos saíram da arca agradecendo a Deus, e um lindo arco-íris colorido brilhou no céu como sinal da promessa de Deus de sempre amar e proteger a criação."],"scene":"ark"},{"id":5,"book":"Gênesis","testament":"Antigo Testamento","title":"A torre de Babel","ref":"Gênesis 11,1-9","emoji":"🗼","lesson":"A união verdadeira nasce do respeito. Podemos trabalhar juntos sem querer ser melhores que os outros.","pages":["Depois do dilúvio, as famílias voltaram a crescer e viajaram juntas até uma grande planície na terra de Senaar. Naquele tempo, todas as pessoas falavam a mesma língua e se entendiam com facilidade.","Em vez de agradecerem a Deus e espalharem o bem pelo mundo, alguns líderes tiveram uma ideia cheia de orgulho: “Vamos fabricar tijolos e construir uma cidade com uma torre tão alta que toque o céu! Assim ficaremos famosos e seremos mais poderosos do que todos”.","Todos começaram a trabalhar sem parar, preocupados apenas com sua própria fama e esquecendo-se de ouvir a Deus e de cuidar uns dos outros. O coração daquelas pessoas estava ficando cheio de vaidade e desejo de mandar em tudo.","Vendo que aquele orgulho só traria problemas, Deus confundiu as línguas dos construtores. De repente, quando alguém pedia um tijolo, o outro entendia outra coisa! Sem conseguirem se comunicar, tiveram de parar a construção da torre, que ficou conhecida como Babel.","As pessoas então se dividiram em grupos e foram morar em diferentes partes da terra, dando origem aos muitos povos e idiomas que existem hoje. A história nos ensina que a verdadeira grandeza nasce da humildade, do respeito às diferenças e da união para o bem."],"scene":"tower"},{"id":6,"book":"Gênesis","testament":"Antigo Testamento","title":"Deus chama Abraão","ref":"Gênesis 12; 15; 17","emoji":"⭐","lesson":"A fé é confiar em Deus e caminhar com esperança, mesmo quando ainda não sabemos todos os detalhes.","pages":["Na cidade de Harã vivia um homem bom chamado Abraão junto com sua esposa Sara. Eles tinham uma vida tranquila, rebanhos e muitos amigos, mas havia uma tristeza silenciosa no coração dos dois: eles já eram idosos e nunca haviam conseguido ter filhos.","Certo dia, Deus chamou Abraão e lhe fez um convite surpreendente: “Deixe sua terra e a casa de seus parentes e vá para o lugar que eu lhe mostrarei. Eu abençoarei você, farei de você um grande povo e, por meio da sua família, todas as nações da terra serão abençoadas”.","Mesmo sem saber exatamente onde ficava aquela nova terra, Abraão confiou plenamente em Deus. Arrumou suas tendas, reuniu sua família e seus rebanhos e partiu em uma longa caminhada pelo deserto até chegar à terra de Canaã.","Em uma noite muito estrelada, Abraão sentiu dúvidas sobre como teria uma grande família se ainda não tinha nenhum filho. Deus o levou para fora da tenda e disse: “Olhe para o céu e tente contar as estrelas, se puder. Assim será a sua descendência!”.","Abraão olhou para aquele céu infinito e acreditou na promessa de Deus com todo o seu coração. Por causa dessa confiança corajosa, Abraão ficou conhecido para sempre como o nosso pai na fé."],"scene":"stars"},{"id":7,"book":"Gênesis","testament":"Antigo Testamento","title":"O nascimento de Isaac","ref":"Gênesis 18; 21","emoji":"👶","lesson":"Deus acompanha nossas famílias e nos ensina a ter esperança e gratidão.","pages":["Abraão e Sara já tinham quase cem anos e continuavam morando em suas tendas na terra de Canaã, esperando com paciência o cumprimento da promessa de Deus.","Em uma tarde muito quente, Abraão estava sentado à entrada de sua tenda quando avistou três visitantes misteriosos. Muito hospitaleiro, correu ao encontro deles, ofereceu água fresca para lavarem os pés e pediu a Sara que preparasse pães quentinhos e uma refeição especial.","Durante a conversa, os mensageiros de Deus anunciaram uma notícia maravilhosa: “No próximo ano, voltaremos aqui, e Sara terá um filho!”. Ouvindo isso de dentro da tenda, Sara deu um sorriso tímido, achando impossível ser mãe naquela idade.","Mas para Deus nada é impossível! No tempo exato prometido, Sara deu à luz um lindo menino. Abraão e Sara deram a ele o nome de Isaac, que significa “riso”, porque o nascimento do bebê encheu toda a casa de alegria e gratidão.","A chegada de Isaac mostrou a toda a família que Deus sempre cumpre suas promessas no momento certo e que a esperança nunca deve se apagar em nossos corações."],"scene":"tents"},{"id":8,"book":"Gênesis","testament":"Antigo Testamento","title":"Jacó e Esaú","ref":"Gênesis 25; 27; 33","emoji":"🤝","lesson":"A reconciliação é possível. Pedir perdão e perdoar ajudam a reconstruir a confiança.","pages":["Quando Isaac cresceu e se casou com Rebeca, Deus abençoou o casal com filhos gêmeos: Esaú, que nasceu primeiro e adorava caçar nos campos, e Jacó, que era mais calmo e gostava de ficar perto das tendas cuidando dos afazeres.","Infelizmente, os dois irmãos começaram a competir pela atenção dos pais e pela bênção especial dada ao filho mais velho. Um dia, com a ajuda da mãe, Jacó enganou o pai Isaac — que já estava idoso e quase não enxergava — para receber a bênção no lugar de Esaú.","Quando Esaú descobriu o que havia acontecido, ficou furioso e jurou se vingar. Com muito medo, Jacó precisou fugir para bem longe, indo morar na terra de seus parentes, onde trabalhou por vinte anos e constituiu sua própria família.","Depois de muitos anos, Deus pediu que Jacó voltasse para casa. Durante a viagem de volta, Jacó sentiu o coração apertado de arrependimento e medo de encontrar o irmão. Ele rezou a Deus pedindo proteção e enviou presentes à frente como sinal de paz.","No dia do encontro, Jacó inclinou-se em sinal de respeito, mas Esaú correu ao seu encontro, abraçou-o com força e chorou de alegria! Os irmãos perdoaram um ao outro, mostrando que o amor e o perdão curam até as feridas mais antigas."],"scene":"fields"},{"id":9,"book":"Gênesis","testament":"Antigo Testamento","title":"José do Egito","ref":"Gênesis 37; 39–45","emoji":"🌈","lesson":"Mesmo nas dificuldades, podemos agir com honestidade, perseverança e generosidade.","pages":["Jacó teve doze filhos, mas tinha um carinho muito especial por José, que era bondoso e sincero. Um dia, Jacó deu a José uma linda túnica toda colorida. Seus irmãos mais velhos ficaram cheios de ciúme, ainda mais quando José contou sonhos em que todos se inclinavam diante dele.","Cegos pela inveja, os irmãos fizeram algo terrível: jogaram José em um poço seco e depois o venderam como escravo para mercadores que iam para o distante Egito. Para enganar o pai, sujaram a túnica colorida e disseram que um animal selvagem havia atacado José.","No Egito, José enfrentou muitas injustiças e chegou até a ser preso sem ter culpa de nada. Mesmo assim, nunca deixou de confiar em Deus nem de agir com honestidade. Deus deu a José o dom de interpretar sonhos, e logo a fama de sua sabedoria chegou até o palácio do faraó.","O faraó teve dois sonhos estranhos sobre vacas e espigas de trigo que ninguém conseguia explicar. Chamado ao palácio, José explicou que Deus estava avisando que o Egito teria sete anos de colheitas fartas seguidos por sete anos de muita fome. Impressionado, o faraó nomeou José governador para guardar alimentos para todo o povo.","Quando a grande fome chegou, os irmãos de José viajaram até o Egito para comprar comida e se ajoelharam diante dele sem reconhecê-lo! Em vez de se vingar, José emocionou-se, revelou quem era, perdoou seus irmãos com um grande abraço e trouxe toda a sua família para viver em paz no Egito."],"scene":"rainbow"},{"id":10,"book":"Êxodo","testament":"Antigo Testamento","title":"Moisés e a sarça ardente","ref":"Êxodo 3–4","emoji":"🔥","lesson":"Deus chama cada pessoa a fazer o bem. Mesmo quando sentimos medo, podemos pedir ajuda e coragem.","pages":["Muitos anos depois de José, um novo faraó que não conhecia a história dos israelitas passou a governar o Egito. Com medo de que o povo de Israel ficasse numeroso demais, o faraó os transformou em escravos e mandou jogar os bebês meninos no rio Nilo.","Para salvar seu filhinho, uma mãe corajosa colocou o bebê em um cestinho impermeável entre os juncos do rio. A própria filha do faraó encontrou o cesto, teve compaixão da criança e o adotou como filho, dando-lhe o nome de Moisés.","Moisés cresceu no palácio, mas nunca esqueceu seu povo. Já adulto, ao defender um israelita maltratado, precisou fugir para o deserto de Madiã, onde se tornou pastor de ovelhas e formou sua família.","Certo dia, enquanto levava as ovelhas perto do monte Horebe, Moisés viu uma cena incrível: um arbusto estava pegando fogo, com chamas brilhantes, mas suas folhas verdes não se queimavam! Curioso, ele se aproximou e ouviu a voz de Deus chamando: “Moisés, Moisés! Tire as sandálias, pois o lugar onde você está é terra santa”.","Deus contou que havia ouvido o clamor do seu povo no Egito e escolheu Moisés para libertá-los. Moisés sentiu medo e achou que não saberia falar bem, mas Deus prometeu: “Eu estarei com você!”, e enviou seu irmão Aarão para ajudá-lo nessa grande missão."],"scene":"fire"},{"id":11,"book":"Êxodo","testament":"Antigo Testamento","title":"A saída do Egito e o Mar Vermelho","ref":"Êxodo 12–14","emoji":"🌊","lesson":"A coragem cresce quando caminhamos juntos e confiamos que Deus não nos abandona.","pages":["Obedecendo a Deus, Moisés e Aarão foram até o palácio do faraó pedir: “Deixe o povo de Israel partir para adorar a Deus no deserto!”. O faraó, porém, tinha o coração duro e recusou várias vezes, aumentando ainda mais o trabalho dos escravos.","Para mostrar seu poder e defender seu povo, Deus enviou sinais extraordinários sobre o Egito. Por fim, na noite da Páscoa, os israelitas celebraram uma refeição especial em família, confiando na proteção de Deus, e o faraó finalmente permitiu que partissem.","Com grande alegria, milhares de famílias, crianças e idosos caminharam rumo à liberdade, guiados por uma coluna de nuvem durante o dia e uma coluna de fogo durante a noite. Mas logo o faraó arrependeu-se de tê-los deixado ir e saiu atrás deles com seus carros de guerra.","Os israelitas chegaram às margens do Mar Vermelho e viram o exército egípcio se aproximando! O medo tomou conta de todos, mas Moisés levantou seu cajado e disse: “Não tenham medo! Fiquem firmes e vejam o que Deus fará hoje por vocês!”.","Então soprou um vento forte durante toda a noite, e as águas do Mar Vermelho se abriram ao meio, formando duas grandes paredes de água e um caminho seco no fundo do mar! Todo o povo atravessou em segurança para a outra margem e cantou hinos de louvor pela liberdade."],"scene":"sea"},{"id":12,"book":"Êxodo","testament":"Antigo Testamento","title":"Os Dez Mandamentos","ref":"Êxodo 19–20; 24","emoji":"📜","lesson":"Os mandamentos ensinam a amar a Deus e ao próximo, respeitando a vida, a família e a verdade.","pages":["Já livres no deserto, os israelitas caminharam até chegarem ao pé do imponente monte Sinai. Deus cuidava deles todos os dias, enviando água da rocha e um alimento doce vindo do céu chamado maná para que ninguém passasse fome.","No monte Sinai, Deus convidou o povo a fazer uma aliança de amizade: Ele seria o Deus deles, e eles seriam o seu povo querido. Para ensinar como viver em paz, justiça e respeito, Deus chamou Moisés ao topo da montanha.","Entre nuvens e clarões que mostravam a grandeza de Deus, Moisés recebeu duas tábuas de pedra onde estavam escritos os Dez Mandamentos — regras de amor que orientam até hoje a vida de todos os cristãos.","Os três primeiros mandamentos ensinam a amar a Deus acima de tudo, respeitar o seu santo nome e guardar o dia do Senhor para a oração e o descanso. Os outros sete ensinam a honrar pai e mãe, proteger a vida, ser fiel, não roubar, não mentir e não ter inveja do que pertence aos outros.","Quando Moisés desceu da montanha com as tábuas da Lei, todo o povo prometeu seguir aqueles ensinamentos, descobrindo que obedecer a Deus é o caminho para uma comunidade feliz e fraterna."],"scene":"tablets"},{"id":13,"book":"Josué","testament":"Antigo Testamento","title":"Josué e as muralhas de Jericó","ref":"Josué 6","emoji":"🏰","lesson":"A confiança, a união e a perseverança ajudam a enfrentar desafios. A vitória não deve ser motivo de orgulho ou crueldade.","pages":["Depois de caminhar pelo deserto durante quarenta anos, o povo de Israel finalmente chegou às portas da Terra Prometida. Moisés já havia descansado em Deus, e agora o corajoso Josué era o novo líder encarregado de guiar o povo.","Bem à frente deles estava Jericó, uma cidade cercada por muralhas enormes e portões trancados. Parecia impossível entrar ali, mas Deus apareceu a Josué e deu uma instrução muito diferente de qualquer batalha comum.","Em vez de usarem máquinas de guerra, os israelitas deveriam marchar em silêncio ao redor da cidade uma vez por dia, durante seis dias, levando a Arca da Aliança enquanto sete sacerdotes tocavam trombetas feitas de chifre de carneiro.","O povo obedeceu com fé e disciplina, mesmo sem entender como aquilo funcionaria. No sétimo dia, acordaram bem cedo e deram sete voltas completas ao redor das muralhas de Jericó.","Na sétima volta, os sacerdotes tocaram um som longo e forte nas trombetas, Josué deu o sinal e todo o povo soltou um grande brado de confiança em Deus! Naquele instante, as gigantescas muralhas de Jericó vieram abaixo, mostrando que a fé e a obediência vencem qualquer obstáculo."],"scene":"walls"},{"id":14,"book":"Juízes","testament":"Antigo Testamento","title":"Sansão, o homem de grande força","ref":"Juízes 13–16","emoji":"💪","lesson":"A força verdadeira inclui responsabilidade, humildade e domínio de si mesmo.","pages":["Na época em que o povo de Israel era guiado por juízes, um anjo do Senhor apareceu a um casal que não tinha filhos e anunciou: “Vocês terão um menino que será consagrado a Deus desde o nascimento, e ele começará a libertar Israel”.","O menino recebeu o nome de Sansão e cresceu abençoado por Deus com uma força física extraordinária. Como sinal de sua consagração e amizade com Deus, seus cabelos nunca podiam ser cortados.","Quando cresceu, Sansão realizou feitos incríveis para defender seu povo contra os filisteus. Porém, muitas vezes agia por impulso e confiava demais na própria força, esquecendo-se de pedir sabedoria a Deus.","Os inimigos descobriram que Sansão gostava muito de uma mulher chamada Dalila e ofereceram moedas de prata para que ela descobrisse o segredo de tanta força. Depois de muita insistência, Sansão acabou contando sobre sua consagração e seus cabelos.","Enquanto Sansão dormia, cortaram seus cabelos e o prenderam. Na prisão, arrependido e humilde, Sansão voltou a rezar de todo coração. Seus cabelos voltaram a crescer e, no último momento, Deus lhe devolveu a força para libertar seu povo, ensinando que nossos dons só têm valor quando usados com humildade."],"scene":"palace"},{"id":15,"book":"Rute","testament":"Antigo Testamento","title":"Rute e Noemi","ref":"Rute 1–4","emoji":"🌾","lesson":"Lealdade, amizade e cuidado com a família são formas concretas de amor.","pages":["Durante um tempo de grande falta de alimentos em Belém, uma mulher chamada Noemi mudou-se com seu marido e seus dois filhos para a terra de Moab. Lá, seus filhos se casaram com duas jovens moabitas: Orfa e Rute.","Infelizmente, o marido e os dois filhos de Noemi faleceram, deixando as três mulheres sozinhas. Quando soube que a colheita havia voltado em Belém, Noemi decidiu retornar para sua terra natal e aconselhou suas noras a ficarem com suas próprias famílias.","Orfa despediu-se chorando, mas Rute abraçou Noemi com firmeza e disse palavras inesquecíveis: “Não me peça para deixar você! Aonde você for, eu irei; o seu povo será o meu povo, e o seu Deus será o meu Deus!”.","Chegando a Belém, Rute trabalhou duro todos os dias recolhendo espigas de cevada que caíam nos campos para garantir o sustento das duas. O dono das terras, um homem generoso chamado Booz, admirou o carinho de Rute por sua sogra e ordenou que todos a tratassem com bondade.","Com o tempo, Booz e Rute se casaram e tiveram um filho chamado Obed, que mais tarde seria o avô do grande rei Davi! Assim, a fidelidade e o amor de Rute entraram para a própria família de Jesus."],"scene":"fields"},{"id":16,"book":"1 Samuel","testament":"Antigo Testamento","title":"O pequeno Samuel escuta Deus","ref":"1 Samuel 3","emoji":"👂","lesson":"É importante aprender a escutar com atenção, especialmente quando alguém precisa de nós.","pages":["Na cidade de Silo ficava o santuário onde o povo ia rezar e oferecer sacrifícios a Deus. Ali vivia o pequeno Samuel, um menino obediente e prestativo que havia sido consagrado por sua mãe Ana para ajudar o idoso sacerdote Eli.","Samuel cuidava das lâmpadas do templo, abria as portas pela manhã e estava sempre pronto para servir. Certa noite, quando todos já estavam deitados e o silêncio tomava conta do santuário, uma voz suave chamou: “Samuel! Samuel!”.","Pensando que fosse o sacerdote Eli precisando de ajuda, o menino levantou-se depressa, correu até o quarto dele e disse: “Aqui estou, o senhor me chamou!”. Eli respondeu: “Não chamei, meu filho; volte a dormir”.","Isso aconteceu três vezes seguidas! Na terceira vez, o sábio sacerdote Eli compreendeu que era o próprio Deus quem estava chamando o menino e o orientou: “Volte a deitar-se e, se Ele chamar novamente, responda: Fala, Senhor, que o teu servo escuta!”.","Quando a voz chamou mais uma vez, Samuel respondeu exatamente como havia aprendido. Deus conversou com ele e o preparou para se tornar um grande profeta, ensinando a todas as crianças que Deus também fala ao nosso coração no silêncio da oração."],"scene":"temple"},{"id":17,"book":"1 Samuel","testament":"Antigo Testamento","title":"Davi e Golias","ref":"1 Samuel 17","emoji":"🪨","lesson":"Coragem não depende do tamanho. A confiança e a inteligência podem nos ajudar a enfrentar desafios.","pages":["O exército de Israel estava acampado diante dos filisteus, separado apenas por um vale. Todos os dias, um guerreiro gigante chamado Golias, com quase três metros de altura e uma armadura pesada de bronze, desafiava os israelitas para um duelo. Todos tremiam de medo.","Davi era o filho mais novo de Jessé e cuidava das ovelhas da família em Belém. Um dia, seu pai pediu que levasse pães e queijos para seus irmãos mais velhos que estavam no acampamento militar. Ao chegar lá, Davi ouviu os gritos arrogantes de Golias.","Cheio de coragem e confiança em Deus, Davi apresentou-se ao rei Saul e disse: “Eu enfrentarei esse gigante! Deus me livrou das garras de leões e ursos quando eu protegia minhas ovelhas, e também me ajudará agora”.","Saul tentou vestir Davi com sua armadura real, mas era pesada demais para o jovem pastor. Então Davi tirou a armadura, pegou seu cajado de pastor, escolheu cinco pedrinhas bem lisas em um riacho e segurou sua funda de couro.","Quando Golias riu ao ver um rapaz tão jovem, Davi respondeu: “Você vem contra mim com espada e lança, mas eu vou contra você em nome do Senhor!”. Girou a funda com precisão, lançou uma pedra que atingiu a testa do gigante e o derrubou, mostrando que com Deus até os pequenos vencem gigantes."],"scene":"shepherd"},{"id":18,"book":"2 Samuel","testament":"Antigo Testamento","title":"Davi se torna rei","ref":"2 Samuel 5–7","emoji":"👑","lesson":"Liderar é servir. Quem tem responsabilidade deve agir com justiça e cuidar das pessoas.","pages":["Depois de vencer Golias, Davi cresceu em sabedoria, compôs lindos salmos tocando sua harpa e tornou-se o melhor amigo de Jônatas, filho do rei Saul. Quando o reinado de Saul chegou ao fim, as tribos de Israel reuniram-se para escolher Davi como seu novo rei.","Como rei, Davi uniu todo o povo, conquistou a cidade de Jerusalém e trouxe para lá, com grande festa, música e danças de alegria, a Arca da Aliança, fazendo de Jerusalém o coração espiritual de Israel.","Um dia, olhando para seu belo palácio de cedro, Davi pensou em construir um templo grandioso para Deus. Mas Deus enviou o profeta Natã para dizer que o próprio Deus construiria uma casa eterna para a família de Davi, da qual nasceria o Salvador prometido.","Mesmo sendo um grande rei, Davi também cometeu erros graves em sua vida. Quando o profeta Natã lhe mostrou onde havia falhado, Davi não deu desculpas: reconheceu seu pecado, chorou arrependido e pediu perdão a Deus de todo o coração.","Deus perdoou Davi e o ajudou a governar com justiça novamente. Sua história nos ensina que um verdadeiro líder serve ao povo e que reconhecer nossos erros com humildade nos aproxima novamente de Deus."],"scene":"palace"},{"id":19,"book":"1 Reis","testament":"Antigo Testamento","title":"A sabedoria de Salomão","ref":"1 Reis 3; 5–8","emoji":"🦉","lesson":"A sabedoria é mais valiosa que riquezas. Devemos pedir discernimento para escolher o que é justo.","pages":["Quando o rei Davi envelheceu, seu filho Salomão assumiu o trono de Israel. Jovem e cheio de responsabilidades, Salomão sentia o peso de governar um povo tão grande e queria muito agradar a Deus.","Certa noite, Deus apareceu a Salomão em um sonho e lhe disse: “Peça o que você quiser, e eu lhe darei!”. Salomão poderia ter pedido montanhas de ouro, vida longa ou vitória sobre todos os inimigos, mas fez um pedido muito especial.","“Senhor, sou ainda muito jovem e não sei como governar. Dá-me um coração sábio e atento para saber distinguir entre o bem e o mal e julgar o teu povo com justiça”, respondeu Salomão.","Deus ficou muito feliz com aquele pedido generoso e lhe deu uma sabedoria maior do que a de qualquer outra pessoa, além de paz e prosperidade para todo o reino. Logo pessoas de terras distantes vinham ouvir seus conselhos, e Salomão construiu o magnífico Templo de Jerusalém.","Em um julgamento famoso, duas mulheres discutiam pela posse de um bebê. Com inteligência e sensibilidade, Salomão descobriu rapidamente quem era a verdadeira mãe pelo amor que ela sentia ao querer proteger a vida da criança acima de tudo."],"scene":"palace"},{"id":20,"book":"1 Reis","testament":"Antigo Testamento","title":"O profeta Elias e a viúva","ref":"1 Reis 17","emoji":"🍞","lesson":"A partilha transforma pouco em cuidado. A generosidade é importante mesmo em tempos difíceis.","pages":["Em um tempo em que o rei Acab havia afastado o povo de Deus, surgiu um profeta corajoso chamado Elias. Para despertar o coração do povo, Deus anunciou através de Elias que não choveria naquela terra por vários anos.","Durante a grande seca, Deus cuidou de Elias junto a um riacho, enviando corvos que lhe traziam pão e carne todas as manhãs e tardes. Quando o riacho secou, Deus mandou Elias ir até a cidade de Sarepta, onde uma viúva cuidaria dele.","Ao chegar ao portão da cidade, Elias encontrou uma mãe pobre recolhendo gravetos. Ele lhe pediu um copo de água e um pedacinho de pão. Com lágrimas nos olhos, ela respondeu: “Só tenho um punhado de farinha na panela e um pouquinho de azeite na jarra. Vou preparar uma última refeição para mim e meu filho”.","Elias olhou para ela com ternura e disse: “Não tenha medo! Faça primeiro um pãozinho pequeno para mim e depois prepare para você e seu filho, pois Deus promete que a farinha e o azeite não vão acabar até que volte a chover”.","A viúva acreditou e partilhou o pouco que tinha. Durante todos os dias da seca, a panela de farinha nunca ficou vazia e a jarra de azeite nunca secou, mostrando que Deus multiplica tudo o que partilhamos com amor."],"scene":"fields"},{"id":21,"book":"Tobias","testament":"Antigo Testamento","title":"Tobias e o anjo Rafael","ref":"Tobias 5–12","emoji":"👼","lesson":"A amizade, a confiança e a ajuda de Deus podem nos acompanhar nas jornadas da vida.","pages":["Na cidade de Nínive vivia um homem muito bondoso chamado Tobit, que ajudava os pobres e cuidava de quem sofria. Um dia, depois de fazer uma boa ação, Tobit adormeceu ao ar livre e acabou ficando cego, passando por grandes dificuldades junto com sua esposa Ana.","Lembrando-se de um dinheiro que havia deixado guardado com um amigo em uma cidade distante, Tobit chamou seu jovem filho Tobias e pediu que fizesse essa viagem. Como Tobias não conhecia o caminho, saiu à procura de um guia de confiança.","Logo encontrou um jovem simpático chamado Azarias, que conhecia perfeitamente a estrada. Sem que Tobias soubesse, Azarias era na verdade o arcanjo São Rafael, enviado por Deus para proteger e guiar o rapaz durante toda a jornada.","Pelo caminho, o anjo Rafael salvou Tobias de um grande peixe no rio Tigre e o ajudou a conhecer Sara, uma jovem boa que também precisava da ajuda de Deus. Com as orações e orientações de Rafael, Tobias e Sara se casaram cheios de alegria.","Na volta para casa, seguindo o conselho do anjo, Tobias aplicou o fel do peixe nos olhos do pai, e Tobit voltou a enxergar perfeitamente! Antes de voltar ao céu, São Rafael revelou quem era e lembrou a família de sempre louvar e agradecer a Deus."],"scene":"angels"},{"id":22,"book":"Ester","testament":"Antigo Testamento","title":"A coragem da rainha Ester","ref":"Ester 4–8","emoji":"👸","lesson":"A coragem pode significar defender outras pessoas. Devemos usar nossa voz para proteger quem está em perigo.","pages":["Longe de Jerusalém, no grande império da Pérsia, vivia uma jovem judia chamada Ester, que havia sido criada com muito amor por seu primo Mardoqueu. Por sua bondade, graça e sabedoria, Ester foi escolhida pelo rei Assuero para se tornar a nova rainha.","No palácio, porém, havia um homem orgulhoso chamado Amã, que ocupava um alto cargo e queria que todos se curvassem diante dele. Como Mardoqueu só se ajoelhava diante de Deus, Amã ficou furioso e convenceu o rei a assinar uma lei cruel contra todo o povo judeu.","Quando soube do perigo, Mardoqueu mandou avisar a rainha Ester: “Talvez você tenha se tornado rainha exatamente para salvar o nosso povo neste momento!”. Ester sentiu muito medo, pois entrar na sala do trono sem ser chamada podia custar a própria vida.","Mesmo assim, Ester encheu-se de coragem. Pediu que todo o povo rezasse e jejuasse durante três dias junto com ela. Depois, vestiu seus trajes reais, entrou na sala do trono e convidou o rei e Amã para um banquete especial.","Durante o banquete, Ester revelou com sabedoria o plano injusto de Amã e pediu pela vida de seu povo. O rei ouviu o pedido da rainha, anulou a lei cruel e protegeu todos os judeus, celebrando a coragem daquela jovem que arriscou tudo para defender os inocentes."],"scene":"palace"},{"id":23,"book":"Jó","testament":"Antigo Testamento","title":"Jó e a esperança","ref":"Jó 1–2; 38–42","emoji":"🌤️","lesson":"Quando alguém sofre, precisa de acolhimento, não de julgamentos. Podemos conversar com Deus com sinceridade.","pages":["Na terra de Hus vivia um homem muito justo chamado Jó, que amava a Deus, ajudava os órfãos e cuidava de sua grande família. Ele tinha sete filhos, três filhas e muitos rebanhos, e todos o admiravam por sua bondade.","De repente, uma série de acontecimentos muito tristes atingiu a vida de Jó: ele perdeu seus rebanhos, sua casa e até mesmo seus filhos, e ainda ficou muito doente. Mesmo diante de tanta dor, Jó não deixou de acreditar na existência de Deus.","Três amigos vieram visitá-lo. No começo ficaram em silêncio ao seu lado, mas depois começaram a discutir, dizendo que Jó devia ter feito algo errado para estar sofrendo tanto. Jó sabia que era inocente e abriu o coração a Deus com sinceridade, fazendo perguntas sobre o porquê da dor.","Então Deus falou com Jó no meio de um redemoinho, mostrando toda a beleza e o mistério da criação — as estrelas, os oceanos, os animais livres e o amanhecer — lembrando que a sabedoria de Deus é muito maior do que podemos imaginar.","Jó acolheu a presença de Deus com humildade, rezou por seus amigos e recebeu de volta a saúde, uma nova família e ainda mais bênçãos, ensinando que nunca estamos sozinhos nos momentos difíceis."],"scene":"stars"},{"id":24,"book":"Jonas","testament":"Antigo Testamento","title":"Jonas e o grande peixe","ref":"Jonas 1–4","emoji":"🐋","lesson":"Não devemos fugir de fazer o bem. Deus é misericordioso e nos chama a oferecer novas oportunidades.","pages":["Um dia, Deus chamou o profeta Jonas e lhe deu uma missão muito importante: “Levante-se, vá até a grande cidade de Nínive e avise seus moradores para deixarem o caminho errado e praticarem o bem!”.","Jonas, porém, não gostava do povo de Nínive e não queria que eles fossem perdoados. Em vez de obedecer, correu para o porto e embarcou em um navio que ia para bem longe, na direção completamente oposta!","No meio do mar, Deus enviou uma tempestade tão forte que as ondas gigantes pareciam que iam quebrar o navio. Os marinheiros ficaram apavorados, e Jonas reconheceu que aquela tempestade acontecia por causa de sua fuga. Pediu então que o lançassem ao mar para salvar a tripulação.","Assim que caiu na água, o mar se acalmou! Deus enviou um grande peixe que engoliu Jonas sem machucá-lo. Dentro da barriga do peixe, durante três dias e três noites, Jonas rezou arrependido e prometeu cumprir sua missão.","O grande peixe levou Jonas até a praia, e dessa vez ele foi direto para Nínive. Quando anunciou a mensagem de Deus, toda a cidade arrependeu-se e mudou de vida! Deus perdoou todos eles, ensinando a Jonas que o amor de Deus alcança a todos sem exceção."],"scene":"sea"},{"id":25,"book":"Daniel","testament":"Antigo Testamento","title":"Daniel na cova dos leões","ref":"Daniel 6","emoji":"🦁","lesson":"A fé nos dá coragem para fazer o que é certo, mesmo quando é difícil.","pages":["No reino da Babilônia, o jovem Daniel destacou-se por sua inteligência, honestidade e fidelidade a Deus. O rei Dario gostava tanto de seu trabalho que decidiu colocá-lo como principal governador de todo o reino.","Outros conselheiros ficaram com muita inveja de Daniel e procuraram algum erro em seu trabalho, mas não encontraram nada. Então armaram uma armadilha: convenceram o rei a assinar um decreto proibindo qualquer pessoa de rezar a outro deus ou homem além do próprio rei durante trinta dias, sob pena de ser jogada na cova dos leões.","Mesmo sabendo da nova lei, Daniel não teve medo. Três vezes ao dia, como sempre fazia, abria as janelas de seu quarto voltadas para Jerusalém, ajoelhava-se e rezava agradecendo a Deus.","Os conselheiros invejosos denunciaram Daniel ao rei. O rei Dario ficou muito triste porque gostava de Daniel, mas não podia voltar atrás na lei. Ao entardecer, Daniel foi lançado na cova escura cheia de leões famintos, e uma grande pedra fechou a entrada.","O rei passou a noite inteira sem dormir e correu até a cova logo ao amanhecer. Para sua imensa alegria, ouviu a voz tranquila de Daniel: “Meu Deus enviou o seu anjo e fechou a boca dos leões, porque sou inocente!”. Daniel saiu sem nenhum arranhão, e todo o reino louvou o Deus verdadeiro."],"scene":"lions"},{"id":26,"book":"1 Macabeus","testament":"Antigo Testamento","title":"Judas Macabeu e a coragem do povo","ref":"1 Macabeus 3–4","emoji":"🛡️","lesson":"A fé, a união e a coragem podem inspirar um povo a defender sua liberdade e sua consciência.","pages":["Séculos depois, um rei estrangeiro chamado Antíoco tentou obrigar o povo judeu a abandonar sua fé, fechou o Templo de Jerusalém e proibiu a leitura das Escrituras. Muitas famílias sofreram perseguição por quererem continuar fiéis a Deus.","Nas montanhas da Judeia vivia um sacerdote idoso chamado Matatias com seus cinco filhos. Eles decidiram não abandonar a aliança com Deus e reuniram todos os que desejavam defender a liberdade de praticar sua fé.","Depois da morte de Matatias, seu filho Judas, conhecido como Macabeu — que significa “martelo” por sua força e coragem — assumiu a liderança. Embora tivessem um grupo pequeno diante de exércitos gigantescos, eles rezavam antes de cada desafio e confiavam na proteção do céu.","Com muita estratégia, união e fé, Judas Macabeu e seus companheiros conseguiram libertar Jerusalém! Ao entrarem no Templo abandonado, limparam tudo com carinho, reconstruíram o altar e acenderam novamente o candelabro sagrado.","Durante oito dias inteiros, o povo celebrou com música, luzes e alegria a nova dedicação do Templo, ensinando que a fé unida à coragem mantém acesa a chama da esperança."],"scene":"walls"},{"id":27,"book":"2 Macabeus","testament":"Antigo Testamento","title":"A coragem dos sete irmãos","ref":"2 Macabeus 7","emoji":"🕯️","lesson":"A fé pode dar força diante de situações muito difíceis. Devemos sempre defender a vida e rejeitar a crueldade.","pages":["Naquele mesmo tempo difícil de perseguição, uma mãe corajosa e seus sete filhos foram levados diante do rei que queria obrigá-los a quebrar os mandamentos de Deus para dar mau exemplo ao povo.","O rei tentou ameaçá-los e também prometeu riquezas e cargos importantes caso obedecessem às suas ordens injustas. Mas desde o irmão mais velho até o mais jovem, todos permaneceram firmes, dizendo que preferiam ser fiéis a Deus.","Ao lado dos filhos, aquela mãe admirável não se deixou vencer pelo desespero. Cheia de fé, encorajou cada um deles falando na língua de seus antepassados, lembrando que Deus havia criado a vida de cada um e que a vida eterna junto de Deus vale mais que qualquer coisa deste mundo.","O filho caçula, ainda muito jovem, respondeu com sabedoria e coragem que não temia os poderosos da terra, pois confiava na justiça e na ressurreição prometida por Deus.","Essa história, que deve ser lida sempre junto com os pais ou catequistas, mostra a força extraordinária do amor de uma mãe e a fidelidade à própria consciência e a Deus."],"scene":"fire"},{"id":28,"book":"Lucas","testament":"Novo Testamento","title":"O anúncio do anjo a Maria","ref":"Lucas 1,26-38","emoji":"🌟","lesson":"Maria nos ensina a confiar em Deus e a responder com generosidade ao chamado para amar.","pages":["Na pequena e tranquila cidade de Nazaré, na Galileia, vivia uma jovem chamada Maria. Ela tinha um coração puro, cheio de bondade e amor a Deus, e estava noiva de um carpinteiro justo e trabalhador chamado José.","Certo dia, enquanto Maria estava em sua casa, o céu parecia ter descido até ali: o arcanjo Gabriel apareceu diante dela iluminado pela glória de Deus e a saudou com alegria: “Alegra-te, cheia de graça! O Senhor está contigo!”.","Maria ficou admirada e pensava no significado daquelas palavras tão bonitas. O anjo então lhe explicou com doçura: “Não tenha medo, Maria! Você encontrou graça diante de Deus. Você ficará grávida e dará à luz um filho, a quem dará o nome de Jesus”.","Gabriel contou ainda que Jesus seria grande, seria chamado Filho do Altíssimo e que o Espírito Santo viria sobre ela com o poder de Deus. Contou também que sua prima Isabel, já idosa, estava esperando um bebê.","Mesmo sem compreender todos os detalhes daquele mistério, Maria confiou inteiramente no amor de Deus e respondeu com generosidade: “Eis aqui a serva do Senhor! Faça-se em mim segundo a tua palavra”. Naquele momento começou a história da nossa salvação."],"scene":"angels"},{"id":29,"book":"Lucas","testament":"Novo Testamento","title":"O nascimento de Jesus","ref":"Lucas 2,1-20; Mateus 1,18-25","emoji":"👶","lesson":"O Natal celebra que Deus se aproxima de nós. Jesus nasce na simplicidade e nos convida a acolher todos com amor.","pages":["Pouco antes do nascimento de Jesus, o imperador romano ordenou que todas as famílias fossem até suas cidades de origem para fazer um recenseamento. José e Maria viajaram de Nazaré até Belém, a cidade do rei Davi.","Quando chegaram a Belém, a cidade estava lotada de viajantes e não havia nenhum quarto disponível nas hospedarias. José procurou um abrigo tranquilo e encontrou uma gruta simples onde os animais descansavam.","Naquela noite santa, Maria deu à luz o menino Jesus, envolveu-o com carinho em panos quentinhos e o deitou em uma manjedoura cheia de palha macia. O Filho de Deus escolheu nascer na simplicidade para estar perto de todas as pessoas.","Nos campos próximos dali, pastores vigiavam seus rebanhos durante a noite. De repente, um anjo do Senhor apareceu cercado de grande luz e anunciou: “Não tenham medo! Trago uma boa notícia de grande alegria: hoje nasceu em Belém o Salvador, que é Cristo Senhor!”. Logo uma multidão de anjos cantou: “Glória a Deus nas alturas e paz na terra!”.","Os pastores correram até Belém, encontraram Maria, José e o bebê deitado na manjedoura e adoraram Jesus com alegria, espalhando por toda parte a notícia maravilhosa do Natal."],"scene":"nativity"},{"id":30,"book":"Mateus","testament":"Novo Testamento","title":"Os Reis Magos visitam Jesus","ref":"Mateus 2,1-12","emoji":"🎁","lesson":"Os presentes mais importantes que podemos oferecer são amor, respeito e generosidade.","pages":["Em terras distantes do Oriente viviam homens sábios que estudavam os astros e as antigas profecias. Certa noite, observaram no céu uma estrela nova, muito brilhante e diferente de todas as outras.","Eles compreenderam que aquela luz anunciava o nascimento de um grande Rei enviado por Deus. Sem demora, prepararam seus camelos, pegaram cofres com presentes preciosos e partiram em uma longa jornada seguindo a estrela.","Passando por Jerusalém, perguntaram onde havia nascido o Rei dos judeus. Os estudiosos das Escrituras indicaram a cidade de Belém. Ao retomarem a viagem, a estrela brilhante reapareceu à frente deles e parou exatamente sobre o lugar onde estava o menino Jesus.","Entrando na casa, os Magos viram o menino com sua mãe Maria, ajoelharam-se com profundo respeito e o adoraram. Abriram seus tesouros e ofereceram ouro (como a um Rei), incenso (como a Deus) e mirra (sinal de sua humanidade).","Avisados por Deus em sonho para não voltarem ao palácio do rei Herodes, os Magos retornaram para sua terra por outro caminho, levando no coração a alegria de terem encontrado Jesus."],"scene":"nativity"},{"id":31,"book":"Lucas","testament":"Novo Testamento","title":"Jesus no templo quando menino","ref":"Lucas 2,41-52","emoji":"📖","lesson":"Crescer também é aprender, fazer perguntas e escutar com respeito.","pages":["Jesus cresceu em Nazaré cercado pelo carinho de Maria e José, aprendendo o ofício de carpinteiro na oficina de seu pai e rezando com sua família todos os dias.","Todos os anos, Maria e José viajavam a Jerusalém para celebrar a festa da Páscoa. Quando Jesus completou doze anos, foi junto com eles na caravana cheia de parentes, amigos e vizinhos.","Terminada a festa, todos começaram a viagem de volta. Como homens e mulheres caminhavam em grupos separados, Maria e José pensaram que Jesus estivesse com os parentes. Depois de um dia inteiro de caminhada, perceberam que ele não estava lá!","Muito preocupados, voltaram depressa para Jerusalém e o procuraram por toda a cidade durante três dias. Finalmente, entraram no Templo e encontraram Jesus sentado no meio dos mestres da Lei, ouvindo-os com atenção e fazendo perguntas tão inteligentes que deixavam todos admirados.","Maria disse com ternura: “Filho, por que agiste assim conosco? Teu pai e eu estávamos aflitos à tua procura!”. Jesus respondeu: “Não sabíeis que devo cuidar das coisas de meu Pai?”. Depois voltou com eles para Nazaré, era obediente e crescia em sabedoria e graça."],"scene":"temple"},{"id":32,"book":"Mateus","testament":"Novo Testamento","title":"O batismo de Jesus","ref":"Mateus 3,13-17","emoji":"🕊️","lesson":"O batismo nos lembra que somos amados por Deus e chamados a viver como seus filhos.","pages":["Antes de Jesus iniciar sua missão pública, Deus enviou João Batista, filho de Isabel e Zacarias, para preparar o coração do povo. João vivia no deserto, vestia roupas simples e convidava todos a mudarem de vida e a praticarem a justiça.","Muitas pessoas iam até o rio Jordão para ouvir João e receber o batismo nas águas como sinal de arrependimento e desejo de recomeçar. João sempre explicava: “Eu batizo vocês com água, mas depois de mim vem alguém muito maior, que os batizará com o Espírito Santo!”.","Certo dia, o próprio Jesus veio da Galileia até o rio Jordão e entrou na fila junto com todas as pessoas, pedindo a João que o batizasse. João ficou surpreso e disse: “Eu é que preciso ser batizado por ti, e tu vens a mim?”.","Jesus respondeu com humildade que desejava cumprir toda a vontade de Deus. Assim que Jesus foi batizado e saiu da água, os céus se abriram, e o Espírito Santo desceu sobre Ele na forma de uma pomba luminosa.","Ao mesmo tempo, ouviu-se a voz amorosa de Deus Pai dizendo do céu: “Este é o meu Filho amado, em quem eu me agrado!”. Aquele momento revelou o amor da Santíssima Trindade e marcou o início da missão de Jesus."],"scene":"sea"},{"id":33,"book":"João","testament":"Novo Testamento","title":"As bodas de Caná","ref":"João 2,1-11","emoji":"🍇","lesson":"Maria nos ensina a perceber as necessidades dos outros. Jesus transforma a alegria e cuida das pessoas.","pages":["Logo após escolher seus primeiros discípulos, Jesus foi convidado junto com sua mãe Maria para uma alegre festa de casamento na cidade de Caná da Galileia. Havia música, dança, amigos reunidos e mesas fartas.","Naquela época, as festas de casamento duravam vários dias, e oferecer vinho aos convidados era um importante sinal de hospitalidade. No meio da celebração, porém, o vinho acabou antes da hora, o que deixaria os noivos muito envergonhados.","Sempre atenta às necessidades das pessoas, Maria percebeu a preocupação dos serventes, aproximou-se de Jesus e disse simplesmente: “Eles não têm mais vinho”. Em seguida, olhou para os empregados e deu um conselho precioso: “Façam tudo o que Ele disser!”.","Havia ali seis grandes talhas de pedra usadas para a água da purificação. Jesus pediu aos serventes que as enchessem de água até a borda e depois levassem um pouco para o mestre de cerimônias provar.","Quando o mestre provou, a água havia se transformado no melhor vinho de toda a festa! Esse foi o primeiro milagre de Jesus, mostrando sua bondade e o poder da intercessão de Maria."],"scene":"palace"},{"id":34,"book":"Marcos","testament":"Novo Testamento","title":"Jesus acalma a tempestade","ref":"Marcos 4,35-41","emoji":"⛵","lesson":"Quando sentimos medo, podemos pedir ajuda. Jesus ensina confiança e paz.","pages":["Depois de passar o dia inteiro ensinando uma grande multidão à beira do mar da Galileia, Jesus disse aos seus discípulos: “Vamos atravessar para a outra margem do lago!”. Todos entraram no barco e começaram a navegar.","Muito cansado de tanto trabalhar e cuidar das pessoas, Jesus encostou a cabeça em uma almofada na parte de trás do barco e adormeceu profundamente enquanto a brisa suave soprava sobre as águas.","De repente, o céu escureceu e desabou uma tempestade violenta! Ventos fortíssimos agitavam o lago e ondas gigantescas batiam contra o barco, enchendo-o de água. Mesmo sendo pescadores experientes, os discípulos ficaram apavorados.","Sem saber mais o que fazer, correram até Jesus e o acordaram gritando: “Mestre, Mestre, salva-nos! Nós vamos afundar!”. Jesus levantou-se com toda serenidade, olhou para o vento e para o mar agitado e ordenou: “Silêncio! Acalma-te!”.","No mesmo instante, o vento parou e o lago ficou liso como um espelho! Jesus olhou com carinho para os amigos e perguntou: “Por que vocês têm tanto medo? Ainda não têm fé?”. Os discípulos ficaram admirados, descobrindo que com Jesus no barco nenhuma tempestade pode nos vencer."],"scene":"boat"},{"id":35,"book":"João","testament":"Novo Testamento","title":"A multiplicação dos pães e peixes","ref":"João 6,1-15","emoji":"🍞","lesson":"Partilhar o que temos pode fazer a diferença. A generosidade começa com pequenos gestos.","pages":["Onde quer que Jesus fosse, multidões o seguiam para ouvir suas palavras cheias de esperança e ver os doentes serem curados. Certo dia, mais de cinco mil pessoas caminharam até uma colina verdejante perto do lago para estar com Ele.","A tarde foi caindo e todos começaram a sentir fome, pois estavam longe das cidades. Jesus olhou com compaixão para aquelas famílias cansadas e perguntou aos discípulos onde poderiam conseguir pão para alimentar tanta gente.","O apóstolo André aproximou-se e disse: “Aqui há um menino que trouxe seu lanche: cinco pães de cevada e dois peixinhos. Mas o que é isso para tanta gente?”. Aquele menino não guardou o lanche só para si; ofereceu tudo o que tinha com generosidade!","Jesus pediu que todos se sentassem em grupos sobre a grama verdinha. Pegou os cinco pães e os dois peixinhos, ergueu os olhos ao céu, agradeceu a Deus Pai, partiu os pães e entregou aos discípulos para distribuírem.","Um milagre maravilhoso aconteceu: os pães e os peixes multiplicaram-se nas mãos dos discípulos! Todos comeram à vontade até ficarem satisfeitos, e no final ainda recolheram doze cestos cheios de pedaços que sobraram."],"scene":"fields"},{"id":36,"book":"Lucas","testament":"Novo Testamento","title":"O bom samaritano","ref":"Lucas 10,25-37","emoji":"❤️","lesson":"Próximo é quem precisa de ajuda. Amar é agir com compaixão, sem escolher quem merece cuidado.","pages":["Um doutor da Lei perguntou a Jesus o que deveria fazer para alcançar a vida eterna. Jesus lembrou o mandamento de amar a Deus sobre todas as coisas e ao próximo como a si mesmo. Então o homem perguntou: “E quem é o meu próximo?”.","Para responder, Jesus contou uma parábola inesquecível: certo homem descia pela estrada solitária de Jerusalém para Jericó quando foi atacado por ladrões, que levaram tudo o que ele tinha e o deixaram muito ferido à beira do caminho.","Pouco depois, passou por aquela estrada um sacerdote. Ele viu o homem ferido, mas atravessou para o outro lado e seguiu viagem sem parar. Mais tarde, passou um levita, olhou para o ferido e também foi embora sem ajudar.","Por fim, passou por ali um samaritano — alguém de um povo que não costumava conversar com os judeus. Ao ver aquele homem sofrendo, o samaritano sentiu profunda compaixão, aproximou-se, limpou seus ferimentos com azeite e vinho e fez curativos com cuidado.","Colocou o ferido sobre seu próprio animal, levou-o até uma hospedaria e pagou ao dono para que cuidasse dele até melhorar. Jesus então perguntou qual dos três havia sido o próximo daquele homem, ensinando: “Vai e faze tu também o mesmo!”."],"scene":"fields"},{"id":37,"book":"Lucas","testament":"Novo Testamento","title":"O filho pródigo","ref":"Lucas 15,11-32","emoji":"🏡","lesson":"Deus é como um Pai misericordioso. Podemos voltar, pedir perdão e recomeçar.","pages":["Para mostrar como Deus Pai ama cada um de nós e fica feliz quando pedimos perdão, Jesus contou a história de um pai muito bondoso que tinha dois filhos.","O filho mais novo, impaciente e querendo fazer tudo do seu jeito, pediu ao pai sua parte da herança antes da hora. O pai respeitou sua liberdade, e o jovem partiu para um país distante, onde gastou todo o dinheiro com festas e amigos passageiros.","Logo veio uma grande fome naquela terra, e o rapaz ficou sem nada, passando a cuidar de porcos e desejando comer até a comida deles. Arrependido e com saudades de casa, pensou: “Vou voltar para o meu pai e dizer: Pai, pequei contra o céu e contra ti; aceita-me ao menos como teu empregado!”.","Quando ele ainda estava bem longe na estrada, o pai — que todos os dias olhava o horizonte esperando o filho voltar — reconheceu-o, correu ao seu encontro cheio de compaixão, abraçou-o e o beijou com alegria!","O pai mandou vestir o filho com a melhor roupa, colocou um anel em seu dedo e preparou uma grande festa! Quando o irmão mais velho ficou enciumado, o pai explicou com carinho que era preciso celebrar, pois seu irmão estava perdido e foi encontrado."],"scene":"tents"},{"id":38,"book":"Lucas","testament":"Novo Testamento","title":"Zaqueu, o cobrador de impostos","ref":"Lucas 19,1-10","emoji":"🌳","lesson":"Sempre podemos mudar. Um encontro verdadeiro com Jesus inspira reparação e generosidade.","pages":["Na cidade de Jericó morava um homem muito rico chamado Zaqueu, que era chefe dos cobradores de impostos. Como muitos cobradores exigiam dinheiro a mais das pessoas, quase ninguém na cidade gostava de Zaqueu, e ele se sentia muito sozinho.","Um dia, espalhou-se a notícia de que Jesus estava passando por Jericó. Zaqueu sentiu uma vontade enorme de ver quem era Jesus, mas havia uma multidão nas ruas e, como Zaqueu era bem baixinho, não conseguia enxergar nada.","Sem se importar com o que os outros pensariam, Zaqueu correu à frente da multidão e subiu nos galhos de uma árvore figueira bem na beira do caminho por onde Jesus ia passar.","Quando Jesus chegou debaixo da árvore, parou, olhou para cima e chamou com um sorriso acolhedor: “Zaqueu, desça depressa, porque hoje eu preciso ficar na sua casa!”. Zaqueu desceu todo feliz e recebeu Jesus com muita alegria.","Tocada pelo amor e pelo respeito de Jesus, a vida de Zaqueu mudou completamente: ele prometeu dar metade de seus bens aos pobres e devolver quatro vezes mais a quem tivesse prejudicado, mostrando que o amor de Jesus transforma qualquer coração."],"scene":"eden"},{"id":39,"book":"João","testament":"Novo Testamento","title":"Jesus e as crianças","ref":"Marcos 10,13-16","emoji":"🧒","lesson":"Toda criança tem dignidade e merece amor, atenção e respeito. Jesus acolhe os pequenos.","pages":["Por onde Jesus caminhava, pais e mães gostavam de levar seus filhos pequenos para que Ele os tocasse, conversasse com eles e lhes desse uma bênção especial.","Certa vez, quando muitas famílias se aproximaram com suas crianças alegres e curiosas, alguns discípulos ficaram impacientes e tentaram afastá-las, achando que Jesus estava ocupado demais ensinando os adultos.","Vendo aquilo, Jesus não gostou da atitude dos discípulos e disse com firmeza e ternura: “Deixai vir a mim as crianças e não as impeçais, porque o Reino de Deus pertence aos que são como elas!”.","Jesus sentou-se, chamou cada criança para perto de si, abraçou-as com carinho, colocou as mãos sobre suas cabeças e as abençoou uma por uma.","Com esse gesto lindo, Jesus mostrou que toda criança tem um valor imenso aos olhos de Deus e que os adultos também devem aprender a confiar em Deus com a pureza e a alegria de uma criança."],"scene":"eden"},{"id":40,"book":"João","testament":"Novo Testamento","title":"A ressurreição de Lázaro","ref":"João 11,1-44","emoji":"🌅","lesson":"Jesus é fonte de vida e esperança. Podemos acompanhar com carinho quem está triste.","pages":["Na aldeia de Betânia, perto de Jerusalém, moravam três irmãos que eram grandes amigos de Jesus: Marta, Maria e Lázaro. Sempre que Jesus passava por ali, era recebido com muito carinho naquela casa.","Certo dia, Lázaro ficou gravemente doente, e suas irmãs mandaram um recado urgente para Jesus. Quando Jesus chegou a Betânia, Lázaro já havia falecido havia quatro dias e estava sepultado em uma gruta fechada por uma pedra pesada.","Marta correu ao encontro de Jesus e disse com fé: “Senhor, se estivesses aqui, meu irmão não teria morrido! Mas sei que Deus te dará tudo o que pedires”. Jesus respondeu: “Eu sou a ressurreição e a vida. Quem crê em mim, ainda que morra, viverá!”.","Ao ver Maria e os amigos chorando de saudade, o próprio Jesus emocionou-se e chorou junto com eles, mostrando quanto amava seu amigo. Depois foi até o túmulo e pediu que retirassem a pedra.","Jesus rezou agradecendo a Deus Pai e gritou com voz forte: “Lázaro, vem para fora!”. Naquele instante, Lázaro saiu vivo da gruta, enchendo todos de admiração e mostrando que Jesus tem poder sobre a morte."],"scene":"sunrise"},{"id":41,"book":"Mateus","testament":"Novo Testamento","title":"A entrada de Jesus em Jerusalém","ref":"Mateus 21,1-11","emoji":"🌿","lesson":"Jesus é um rei diferente: humilde, pacífico e próximo das pessoas.","pages":["Aproximava-se a grande festa da Páscoa em Jerusalém, e Jesus decidiu entrar na cidade para cumprir sua missão de amor. Em vez de chegar montado em um cavalo de guerra como os reis poderosos deste mundo, Jesus pediu que seus discípulos trouxessem um jumentinho manso.","Jesus montou no jumentinho e desceu pelo monte das Oliveiras rumo aos portões de Jerusalém, mostrando que Ele é o Rei da paz, da humildade e da mansidão.","Quando as pessoas viram Jesus se aproximando, uma grande alegria tomou conta das ruas! Homens, mulheres e crianças estenderam seus mantos coloridos no chão como um tapete real e cortaram ramos verdes das árvores para balançar no ar.","Todos cantavam e aclamavam com entusiasmo: “Hosana ao Filho de Davi! Bendito o que vem em nome do Senhor! Hosana nas alturas!”.","Esse dia feliz é celebrado todos os anos pela Igreja no Domingo de Ramos, quando levamos ramos abençoados para casa e aclamamos Jesus como o Rei dos nossos corações."],"scene":"palace"},{"id":42,"book":"Mateus","testament":"Novo Testamento","title":"A Última Ceia","ref":"Mateus 26,17-30; Lucas 22,14-20","emoji":"🍷","lesson":"Jesus ensina a servir, amar e partilhar. A Eucaristia é o centro da vida da Igreja Católica.","pages":["Na quinta-feira antes da Páscoa, Jesus reuniu seus doze apóstolos em uma sala grande em Jerusalém para celebrar a Última Ceia. Ele sabia que havia chegado a hora de entregar sua vida por amor a toda a humanidade.","Antes da refeição, Jesus levantou-se da mesa, pegou uma bacia com água e uma toalha e começou a lavar e enxugar os pés de cada um dos discípulos! Com esse gesto de humildade, ensinou: “Dei-vos o exemplo para que façais assim como eu fiz: amem-se e sirvam uns aos outros”.","Durante a ceia, Jesus pegou o pão, deu graças a Deus Pai, partiu-o e entregou aos apóstolos dizendo: “Tomai e comei, isto é o meu Corpo que será entregue por vós”.","Em seguida, pegou o cálice com vinho, agradeceu novamente e passou a todos dizendo: “Bebei dele todos, porque isto é o meu Sangue da nova aliança, derramado por muitos para o perdão dos pecados. Fazei isto em memória de mim”.","Naquela noite santa, Jesus instituiu a Eucaristia e o sacerdócio, deixando-nos o maior presente da Igreja Católica: sua presença viva na Santa Missa para alimentar nossa alma."],"scene":"temple"},{"id":43,"book":"Mateus","testament":"Novo Testamento","title":"A Paixão e morte de Jesus","ref":"Mateus 26–27; Marcos 14–15; Lucas 22–23; João 18–19","emoji":"✝️","lesson":"A cruz revela o amor de Jesus, que se entrega por todos. A história deve ser lida com sensibilidade e acompanhamento adulto.","pages":["Depois da Última Ceia, Jesus foi rezar no Jardim das Oliveiras. Mesmo sentindo profunda tristeza ao pensar no sofrimento que viria, Ele confiou totalmente em Deus Pai e rezou: “Pai, faça-se a tua vontade!”.","Logo chegaram soldados guiados por Judas, que traiu Jesus com um beijo. Jesus foi preso e levado diante das autoridades, que o condenaram injustamente, mesmo Ele tendo feito apenas o bem e ensinado o amor.","Carregando uma pesada cruz de madeira até o monte Calvário, Jesus caiu várias vezes pelo caminho, mas foi ajudado por Simão Cirineu e consolado pelo olhar amoroso de sua mãe Maria e de Verônica.","Pregado na cruz, Jesus não sentiu ódio nem desejou vingança; pelo contrário, rezou por todos: “Pai, perdoa-lhes, porque não sabem o que fazem!”. Também confiou sua mãe Maria ao cuidado do discípulo amado João, dando-a como mãe de todos nós.","Às três horas da tarde, Jesus entregou seu espírito nas mãos do Pai e morreu na cruz por amor a cada um de nós. Seus amigos colocaram seu corpo em um túmulo novo na rocha, preparando-se para o grande milagre que viria no domingo."],"scene":"cross"},{"id":44,"book":"Mateus","testament":"Novo Testamento","title":"A ressurreição de Jesus","ref":"Mateus 28; Marcos 16; Lucas 24; João 20","emoji":"🌅","lesson":"A Páscoa é a grande festa da esperança: o amor de Deus é mais forte que a morte.","pages":["Na madrugada de domingo, primeiro dia da semana, quando o sol começava a iluminar o céu, Maria Madalena e outras mulheres foram até o túmulo de Jesus levando perfumes aromáticos.","Pelo caminho, perguntavam preocupadas quem rolaria a pedra pesada da entrada. Mas, ao chegarem lá, viram que a pedra já estava rolada e o túmulo estava completamente vazio! Um anjo vestido de branco brilhante disse: “Não tenham medo! Jesus, que foi crucificado, ressuscitou! Ele não está aqui!”.","Cheias de emoção e alegria, as mulheres correram para avisar os discípulos. Pedro e João correram até o sepulcro e viram apenas os panos de linho dobrados, começando a compreender as Escrituras.","Logo depois, o próprio Jesus ressuscitado apareceu a Maria Madalena no jardim, chamando-a pelo nome, e também apareceu aos apóstolos reunidos, mostrando suas mãos e dizendo: “A paz esteja convosco!”.","A ressurreição de Jesus é a maior alegria da fé cristã! Ela mostra que o amor de Deus venceu a morte para sempre e que todos nós somos chamados à vida eterna."],"scene":"sunrise"},{"id":45,"book":"Atos dos Apóstolos","testament":"Novo Testamento","title":"A ascensão de Jesus","ref":"Atos 1,1-11","emoji":"☁️","lesson":"Jesus confia aos discípulos a missão de anunciar o amor de Deus em todos os lugares.","pages":["Durante quarenta dias após sua ressurreição, Jesus apareceu muitas vezes aos seus apóstolos, comeu com eles, explicou as Escrituras e fortaleceu a fé de todos para a grande missão que teriam pela frente.","Um dia, Jesus levou os discípulos até o monte das Oliveiras, perto de Betânia. Eles perguntaram se já era a hora de restaurar o reino de Israel, mas Jesus explicou que o importante era serem suas testemunhas em todo o mundo.","“Vocês receberão a força do Espírito Santo que descerá sobre vocês, e serão minhas testemunhas em Jerusalém, em toda a Judeia e Samaria, e até os confins da terra”, prometeu Jesus.","Depois de dizer essas palavras, Jesus ergueu as mãos, abençoou todos os seus amigos com carinho e foi elevado ao céu diante dos olhos deles, até que uma nuvem luminosa o envolveu.","Dois mensageiros celestes lembraram aos apóstolos que Jesus voltaria um dia na glória, e os discípulos voltaram para Jerusalém cheios de alegria e esperança para rezar juntos."],"scene":"angels"},{"id":46,"book":"Atos dos Apóstolos","testament":"Novo Testamento","title":"Pentecostes: a vinda do Espírito Santo","ref":"Atos 2,1-13","emoji":"🔥","lesson":"O Espírito Santo nos inspira a falar com coragem, construir a paz e viver unidos apesar das diferenças.","pages":["Dez dias depois da Ascensão de Jesus ao céu, celebrava-se em Jerusalém a festa de Pentecostes. Os apóstolos estavam reunidos em oração junto com Maria, a mãe de Jesus, esperando a promessa do Pai.","De repente, ouviu-se vindo do céu um som parecido com o sopro de um vento forte e impetuoso que encheu toda a casa onde estavam sentados.","Logo apareceram pequenas línguas como de fogo que se dividiram e pousaram suavemente sobre a cabeça de cada um deles, sem queimar ninguém! Todos ficaram repletos do Espírito Santo e sentiram uma coragem e uma alegria imensas.","Saindo pelas ruas de Jerusalém, os apóstolos começaram a anunciar as maravilhas de Deus, e pessoas vindas de muitos países diferentes ouviam cada um na sua própria língua!","Pedro falou à multidão com entusiasmo, e cerca de três mil pessoas foram batizadas naquele mesmo dia. Pentecostes marca o nascimento da Igreja Católica, guiada pelo Espírito Santo até hoje."],"scene":"fire"},{"id":47,"book":"Atos dos Apóstolos","testament":"Novo Testamento","title":"A conversão de São Paulo","ref":"Atos 9,1-19","emoji":"✨","lesson":"Ninguém está impedido de mudar de vida. Deus pode transformar nossos caminhos.","pages":["Nos primeiros tempos da Igreja, havia um homem muito estudioso chamado Saulo, que não acreditava que Jesus era o Salvador e perseguia os cristãos, prendendo muitos deles em Jerusalém.","Um dia, Saulo pediu cartas de autorização para ir até a cidade de Damasco prender os seguidores de Jesus que moravam lá. Enquanto caminhava pela estrada ao meio-dia, uma luz vinda do céu, mais brilhante que o sol, envolveu-o de repente!","Saulo caiu no chão e ouviu uma voz cheia de amor e firmeza perguntar: “Saulo, Saulo, por que me persegues?”. Assustado, ele perguntou: “Quem és tu, Senhor?”. A voz respondeu: “Eu sou Jesus, a quem tu persegues!”.","Ao levantar-se, Saulo percebeu que não conseguia enxergar nada e foi guiado pela mão até Damasco, onde passou três dias rezando. Deus enviou um discípulo bondoso chamado Ananias, que impôs as mãos sobre Saulo, devolvendo-lhe a visão e batizando-o.","Transformado pelo encontro com Jesus, Saulo passou a ser chamado de Paulo e tornou-se um dos maiores missionários da história, viajando por muitos países para anunciar o amor de Cristo."],"scene":"sunrise"},{"id":48,"book":"Apocalipse","testament":"Novo Testamento","title":"A nova criação: Deus enxuga nossas lágrimas","ref":"Apocalipse 21–22","emoji":"🌈","lesson":"A esperança cristã aponta para um mundo renovado, sem sofrimento, onde Deus habita com seu povo.","pages":["O último livro da Bíblia chama-se Apocalipse, que significa “revelação”. Ele foi escrito pelo apóstolo João usando imagens cheias de luz e esperança para consolar os cristãos que enfrentavam dificuldades.","Em uma visão maravilhosa, João contemplou um céu novo e uma terra nova, completamente renovados pelo amor de Deus, onde tudo o que causava tristeza havia ficado para trás.","João viu descer do céu a cidade santa, a Nova Jerusalém, brilhando como uma joia preciosa, e ouviu uma voz anunciar: “Eis aqui a morada de Deus com os seres humanos! Ele habitará com eles, e eles serão o seu povo”.","Naquela visão cheia de
