 ternura, Deus mesmo enxuga todas as lágrimas dos olhos de seus filhos: não haverá mais morte, nem luto, nem choro, nem dor, porque Deus faz novas todas as coisas!","A Bíblia termina com uma mensagem linda de esperança: Jesus promete que está sempre conosco e nos convida a construir desde já, com pequenos gestos de amor, um mundo mais parecido com o céu."],"scene":"rainbow"},{"id":49,"book":"Gênesis","testament":"Antigo Testamento","title":"A escada de Jacó até o céu","ref":"Gênesis 28,10-22","emoji":"🪜","scene":"angels","lesson":"Deus está sempre perto de nós, mesmo quando viajamos ou estamos longe de casa.","pages":["Quando Jacó precisou viajar para longe de casa pela primeira vez, caminhou o dia inteiro pelas estradas poeirentas até que o sol se pôs e as primeiras estrelas começaram a brilhar no céu.","Sem ter uma cama macia ou uma tenda para descansar, Jacó escolheu uma pedra lisa para usar como travesseiro, deitou-se sob o céu aberto e logo pegou no sono.","Durante a noite, Jacó teve um sonho extraordinário: viu uma imensa escada apoiada na terra cujo topo tocava o céu! Por aquela escada luminosa, anjos de Deus subiam e desciam sem parar.","No alto da escada estava o próprio Deus, que olhou para Jacó com bondade e lhe disse: “Eu sou o Deus de Abraão e de Isaac. Estarei com você por onde quer que você vá e o trarei de volta em segurança!”.","Ao acordar emocionado, Jacó exclamou: “Verdadeiramente Deus está neste lugar, e eu não sabia!”. Ele agradeceu a Deus e seguiu sua viagem com o coração cheio de paz."]},{"id":50,"book":"Juízes","testament":"Antigo Testamento","title":"Débora, a juíza corajosa","ref":"Juízes 4–5","emoji":"🌴","scene":"eden","lesson":"Sabedoria, coragem e fé ajudam a resolver conflitos e trazer paz para toda a comunidade.","pages":["No tempo dos juízes, o povo de Israel era guiado por uma mulher extraordinária chamada Débora. Ela era profetisa, juíza e mãe dedicada, conhecida em toda a terra por sua grande sabedoria.","Debaixo da sombra de uma grande palmeira nas montanhas de Efraim, Débora recebia todos os dias as pessoas que vinham pedir conselhos, resolver desentendimentos e buscar decisões justas.","Naquela época, o povo de Israel estava sendo oprimido por um exército muito poderoso. Deus inspirou Débora a chamar um líder chamado Baraque para reunir o povo e defender suas famílias.","Baraque respondeu que só iria se Débora fosse junto com ele, pois confiava na fé e na presença de Deus nela. Débora aceitou com coragem e acompanhou o povo, encorajando a todos a confiarem na ajuda do Senhor.","Com a proteção de Deus, o povo conquistou a liberdade e a paz por quarenta anos, e Débora compôs um belo cântico de louvor agradecendo a Deus pela vitória."]},{"id":51,"book":"Juízes","testament":"Antigo Testamento","title":"Gideão e os trezentos valentes","ref":"Juízes 6–7","emoji":"🏺","scene":"fire","lesson":"Com Deus ao nosso lado, não precisamos ser muitos para vencer o medo e fazer o bem.","pages":["Quando povos vizinhos invadiam os campos e levavam as colheitas de Israel, um jovem chamado Gideão estava escondido tentando salvar um pouco de trigo para sua família.","De repente, um anjo do Senhor sentou-se debaixo de um carvalho e saudou Gideão: “O Senhor está com você, guerreiro valente!”. Gideão ficou surpreso, pois sua família era simples e ele se achava pequeno demais para ajudar o povo.","Deus, porém, garantiu que estaria com ele e até deu a Gideão o sinal do orvalho na lã de ovelha para confirmar sua missão. Gideão reuniu um grande grupo de homens para defender Israel.","Para mostrar que a vitória viria de Deus e não da força humana, Deus pediu que Gideão reduzisse o grupo até ficarem apenas trezentos homens, equipados não com espadas pesadas, mas com trombetas e tochas acesas escondidas dentro de jarros de barro!","No meio da noite, ao sinal de Gideão, todos tocaram as trombetas, quebraram os jarros e ergueram as tochas brilhantes! Os inimigos assustaram-se com tantas luzes e sons e fugiram, trazendo paz novamente à terra."]},{"id":52,"book":"2 Reis","testament":"Antigo Testamento","title":"O profeta Eliseu e a cura de Naamã","ref":"2 Reis 5,1-19","emoji":"💧","scene":"sea","lesson":"Ouvir conselhos simples com humildade abre portas para a cura e a gratidão.","pages":["Naamã era um comandante muito respeitado e corajoso do exército da Síria, mas tinha uma doença grave na pele que nenhum médico conseguia curar.","Em sua casa trabalhava uma menina israelita muito bondosa, que disse à esposa de Naamã: “Ah, se o meu senhor fosse visitar o profeta Eliseu em Israel! Ele certamente o curaria!”.","Naamã viajou com carros e presentes até a casa simples do profeta Eliseu. Em vez de sair para fazer uma grande cerimônia, Eliseu mandou um mensageiro dizer: “Vá e mergulhe sete vezes no rio Jordão, e sua pele ficará limpa!”.","A princípio, Naamã ficou irritado, achando o pedido simples demais. Mas seus ajudantes falaram com carinho: “Se o profeta tivesse pedido algo difícil, o senhor não faria? Por que não experimentar algo tão simples?”.","Com humildade, Naamã foi até o rio Jordão e mergulhou sete vezes. No sétimo mergulho, sua pele ficou limpinha como a de uma criança! Cheio de alegria, Naamã agradeceu a Eliseu e passou a acreditar no Deus de Israel."]},{"id":53,"book":"Judite","testament":"Antigo Testamento","title":"A sabedoria e a coragem de Judite","ref":"Judite 8–13; 15","emoji":"🕊️","scene":"walls","lesson":"A oração, a inteligência e o amor pelo próximo dão força para defender o bem.","pages":["Na cidade montanhosa de Betúlia morava uma mulher muito respeitada chamada Judite. Ela era conhecida por sua vida de oração, sua bondade com os vizinhos e sua inteligência admirável.","Certo dia, um enorme exército cercou a cidade e cortou o abastecimento de água. Sem água e com medo, os moradores começaram a perder a esperança e pensaram em se render.","Judite reuniu os líderes da cidade e os encorajou com palavras cheias de fé: “Não limitem o poder de Deus! Vamos confiar que o Senhor ouvirá nossas orações e protegerá o nosso povo”.","Depois de rezar longamente pedindo sabedoria e coragem, Judite foi até o acampamento dos invasores e, com muita inteligência e astúcia, conseguiu desarticular os planos do comandante inimigo sem que nenhum inocente da cidade fosse ferido.","Quando Judite voltou a Betúlia anunciando que o perigo havia passado, todos cantaram hinos de louvor a Deus e agradeceram pela coragem daquela mulher que salvou sua cidade."]},{"id":54,"book":"Sabedoria","testament":"Antigo Testamento","title":"O tesouro da Sabedoria de Deus","ref":"Sabedoria 7–9","emoji":"💎","scene":"stars","lesson":"A verdadeira sabedoria é um presente de Deus que nos ensina a amar, perdoar e cuidar do mundo.","pages":["O livro da Sabedoria foi escrito para ajudar jovens e adultos a descobrirem o que realmente tem valor na vida. Nele, o autor conta como aprendeu a pedir a Deus um coração sábio acima de todas as coisas.","“Eu preferi a Sabedoria aos cetros e tronos reais, e considerei que as riquezas não são nada comparadas a ela”, ensina o livro sagrado, mostrando que ouro e prata passam, mas o bem que fazemos permanece para sempre.","A Sabedoria de Deus é descrita como uma luz pura e brilhante, mais bela que o sol e todas as constelações de estrelas, porque nenhuma escuridão consegue apagá-la.","Ela é amiga de todas as pessoas boas, ensina a justiça, a paciência, a coragem e o respeito pela natureza, revelando o carinho do Criador por cada criatura que existe.","Quando rezamos pedindo sabedoria a Deus antes de estudar, brincar ou tomar decisões, Ele ilumina nossa mente para escolhermos sempre o caminho do amor."]},{"id":55,"book":"Eclesiástico","testament":"Antigo Testamento","title":"O valor de um amigo fiel","ref":"Eclesiástico 6,5-17","emoji":"🤗","scene":"eden","lesson":"Um amigo verdadeiro é um tesouro precioso. Sejamos amigos leais, sinceros e bondosos.","pages":["O livro do Eclesiástico reúne conselhos preciosos passados de geração em geração para ensinar as crianças e os jovens a viverem bem em família e na comunidade.","Um dos ensinamentos mais bonitos desse livro fala sobre a amizade verdadeira: “Palavras doces multiplicam os amigos, e uma língua amável facilita as boas conversas”.","O texto sagrado explica que nem todo conhecido é um amigo de verdade, pois alguns só aparecem nos dias de festa, mas desaparecem quando surgem dificuldades.","Já o amigo fiel é como um abrigo seguro nos dias de tempestade! “Um amigo fiel é uma poderosa proteção: quem o encontrou, encontrou um tesouro. Nada se compara a um amigo fiel, e o seu valor não se mede com ouro”.","O livro nos convida também a sermos bons amigos: ouvir com atenção, guardar segredos com lealdade, ajudar quando o colega precisa e agradecer a Deus pelas amizades que temos."]},{"id":56,"book":"Baruc","testament":"Antigo Testamento","title":"Baruc e a luz da esperança","ref":"Baruc 4–5","emoji":"🌅","scene":"sunrise","lesson":"Mesmo depois de momentos tristes, Deus traz alegria e reúne sua família na paz.","pages":["Em um tempo em que muitas famílias de Jerusalém haviam sido levadas para longe de sua terra e sentiam muita saudade de casa, o profeta Baruc escreveu palavras cheias de consolo e esperança.","Baruc convidou o povo a levantar o olhar com confiança para Deus, lembrando que o Senhor nunca se esquece de seus filhos e sempre prepara um novo amanhecer.","“Tire a roupa da tristeza e da aflição, Jerusalém, e vista-se para sempre com a beleza da glória que vem de Deus!”, escreveu o profeta com entusiasmo.","Ele anunciou que Deus aplainaria as montanhas altas e encheria os vales profundos, fazendo crescer árvores perfumadas para dar sombra fresca enquanto seus filhos voltavam para casa cantando de alegria.","Essa mensagem linda nos lembra que a alegria de Deus sempre vence a tristeza e que podemos levar palavras de ânimo para quem está passando por um dia difícil."]},{"id":57,"book":"Daniel","testament":"Antigo Testamento","title":"Os três jovens na fornalha ardente","ref":"Daniel 3","emoji":"🔥","scene":"fire","lesson":"Nunca devemos deixar de fazer o que é certo por medo. Deus caminha conosco nas provas.","pages":["Na Babilônia viviam três jovens amigos de Daniel que amavam muito a Deus: Sadraque, Mesaque e Abednego. Por serem honestos e inteligentes, ajudavam na administração da província.","Um dia, o rei Nabucodonosor mandou construir uma estátua gigante de ouro e ordenou que, ao som das músicas e trombetas, todos se ajoelhassem para adorá-la. Quem não obedecesse seria jogado em uma fornalha acesa.","Quando a música tocou, todos se ajoelharam, menos os três jovens amigos, pois sabiam que só se deve adorar ao Deus verdadeiro. Furioso, o rei mandou aquecer a fornalha sete vezes mais e lançou os três jovens lá dentro.","Mas, ao olhar para dentro da fornalha, o rei levantou-se espantado e gritou aos seus conselheiros: “Não jogamos três homens amarrados no fogo? Pois estou vendo quatro pessoas caminhando livremente no meio das chamas sem se queimar, e o quarto parece um anjo de Deus!”.","Os três jovens louvavam e cantavam a Deus dentro do fogo como se estivessem sob uma brisa fresca! Eles saíram sem nem sequer cheiro de fumaça nas roupas, e o rei reconheceu o poder de Deus."]},{"id":58,"book":"Mateus","testament":"Novo Testamento","title":"Pedro caminha sobre as águas","ref":"Mateus 14,22-33","emoji":"🌊","scene":"boat","lesson":"Quando mantemos os olhos em Jesus, vencemos o medo. Se vacilarmos, Ele logo nos estende a mão.","pages":["Depois da multiplicação dos pães, Jesus pediu que seus discípulos entrassem no barco e atravessassem o mar da Galileia enquanto Ele subia sozinho a um monte para rezar em silêncio.","Durante a madrugada, o barco já estava longe da margem e enfrentava ventos contrários e ondas agitadas. De repente, os discípulos viram alguém caminhando tranquilamente sobre as águas na direção deles!","Assustados, pensaram que fosse um fantasma, mas logo ouviram a voz amiga e serena de Jesus: “Coragem! Sou eu, não tenham medo!”.","Cheio de entusiasmo, Pedro disse: “Senhor, se és tu, manda-me ir até ti sobre as águas!”. Jesus respondeu: “Vem!”. Pedro saiu do barco e começou a andar sobre a água olhando para Jesus! Porém, ao olhar para o vento forte, sentiu medo e começou a afundar.","Pedro gritou: “Senhor, salva-me!”. No mesmo instante, Jesus estendeu a mão, segurou Pedro com firmeza e disse com carinho: “Homem de pouca fé, por que duvidaste?”. Entraram no barco, o vento acalmou-se e todos adoraram Jesus."]},{"id":59,"book":"Lucas","testament":"Novo Testamento","title":"A ovelha perdida e o Bom Pastor","ref":"Lucas 15,1-7; João 10,11-16","emoji":"🐑","scene":"shepherd","lesson":"Cada um de nós é único e precioso para Jesus. Ele sempre cuida de nós com amor.","pages":["Para explicar quanto cada pessoa é importante para Deus, Jesus contou uma história sobre um pastor muito dedicado que cuidava de um rebanho de cem ovelhas.","Todos os dias, o Bom Pastor levava suas ovelhas para pastar em campos verdinhos e beber água limpa nos riachos. Ele conhecia cada ovelha pelo nome e sabia exatamente como cada uma era.","Ao anoitecer, quando contou as ovelhas no aprisco, o pastor percebeu que estavam noventa e nove, mas faltava uma ovelhinha que havia se distraído e se perdido entre as pedras da montanha.","Em vez de dizer “tenho muitas outras, não faz mal”, o pastor deixou as noventa e nove em segurança e saiu imediatamente à procura daquela única ovelhinha perdida, chamando por ela com carinho.","Quando finalmente a encontrou assustada, o pastor não brigou com ela: colocou-a nos ombros com alegria e voltou para casa celebrando com os amigos! Assim Jesus cuida de cada um de nós."]},{"id":60,"book":"João","testament":"Novo Testamento","title":"Jesus e a mulher samaritana no poço","ref":"João 4,1-30","emoji":"⛲","scene":"fields","lesson":"Jesus acolhe todas as pessoas sem preconceito e oferece a água viva da alegria e da paz.","pages":["Em uma viagem da Judeia para a Galileia, Jesus passou pela região da Samaria. Ao meio-dia, cansado da caminhada sob o sol quente, sentou-se para descansar junto ao antigo poço de Jacó.","Logo chegou uma mulher samaritana carregando um cântaro para buscar água. Naquele tempo, judeus e samaritanos não costumavam conversar entre si, mas Jesus quebrou todas as barreiras e pediu com gentileza: “Dá-me de beber!”.","Admirada com aquela atenção, a mulher perguntou como Ele pedia água a uma samaritana. Jesus respondeu com doçura: “Se você conhecesse o dom de Deus, pediria a Ele, e Ele lhe daria uma água viva!”.","Jesus explicou que a água do poço mata a sede por algumas horas, mas a água viva que Ele oferece — a fé, o amor e o Espírito Santo — transforma o coração em uma fonte de alegria eterna.","Emocionada por se sentir compreendida e acolhida por Jesus, a mulher deixou seu cântaro ali mesmo e correu para a cidade chamar todos os vizinhos para conhecerem o Salvador."]},{"id":61,"book":"Marcos","testament":"Novo Testamento","title":"Bartimeu volta a enxergar","ref":"Marcos 10,46-52","emoji":"👁️","scene":"sunrise","lesson":"Quando pedimos ajuda a Jesus com fé e perseverança, Ele sempre nos escuta.","pages":["Na saída da cidade de Jericó estava sentado à beira da estrada um homem cego chamado Bartimeu, que vivia pedindo ajuda aos viajantes porque não podia trabalhar.","Certo dia, Bartimeu ouviu o som de muitos passos e vozes animadas passando pela estrada. Perguntou o que estava acontecendo e lhe contaram: “É Jesus de Nazaré que está passando!”.","Na mesma hora, Bartimeu encheu-se de esperança e começou a gritar bem alto: “Jesus, Filho de Davi, tem compaixão de mim!”. Algumas pessoas tentaram fazê-lo ficar quieto, mas ele gritava ainda mais forte com toda a sua fé.","Ouvindo aquele clamor sincero, Jesus parou no meio da multidão e pediu: “Chamem-no!”. Os discípulos foram até Bartimeu e disseram: “Coragem! Levante-se, Ele está chamando você!”.","Bartimeu deu um salto de alegria, foi até Jesus e disse: “Mestre, que eu veja!”. Jesus respondeu: “Vai, a tua fé te salvou!”. No mesmo instante Bartimeu recuperou a visão e seguiu Jesus pelo caminho louvando a Deus."]},{"id":62,"book":"Lucas","testament":"Novo Testamento","title":"Os dez leprosos e o agradecimento","ref":"Lucas 17,11-19","emoji":"🙏","scene":"fields","lesson":"Dizer “muito obrigado” a Deus e às pessoas torna nosso coração mais feliz e luminoso.","pages":["Caminhando rumo a Jerusalém, Jesus entrou em um povoado onde dez homens que sofriam de uma doença de pele chamada lepra vieram ao seu encontro. Naquele tempo, eles precisavam viver afastados da cidade e se sentiam muito tristes.","Ficando a certa distância, os dez levantaram a voz juntos e pediram: “Jesus, Mestre, tem compaixão de nós!”.","Jesus olhou para eles com grande bondade e disse: “Vão apresentar-se aos sacerdotes!”. Enquanto caminhavam obedecendo ao pedido de Jesus, aconteceu um milagre: todos os dez ficaram completamente curados!","Nove deles ficaram tão apressados para voltar às suas casas e mostrar a cura aos familiares que se esqueceram de voltar para agradecer a Jesus.","Apenas um deles — um samaritano — ao perceber que estava curado, voltou correndo, louvando a Deus em voz alta, ajoelhou-se aos pés de Jesus e agradeceu de todo o coração! Jesus sorriu e lembrou quanto é importante ser grato pelo bem que recebemos."]},{"id":63,"book":"Lucas","testament":"Novo Testamento","title":"Os discípulos na estrada de Emaús","ref":"Lucas 24,13-35","emoji":"🍞","scene":"sunset","lesson":"Reconhecemos Jesus na Palavra de Deus, na Eucaristia e no carinho com os irmãos.","pages":["No próprio domingo da Páscoa, dois discípulos de Jesus caminhavam tristes e cabisbaixos de Jerusalém para uma aldeia chamada Emaús, conversando sobre tudo o que havia acontecido na sexta-feira.","Enquanto caminhavam, o próprio Jesus ressuscitado aproximou-se e começou a andar ao lado deles, mas os olhos dos discípulos ainda não o reconheciam.","Jesus perguntou por que estavam tão tristes e, ouvindo suas dúvidas, explicou com paciência todas as passagens das Escrituras desde Moisés até os profetas, mostrando que o Messias passaria pela cruz para entrar na glória.","Quando chegaram perto de Emaús, já estava anoitecendo. Os discípulos convidaram com hospitalidade: “Fica conosco, Senhor, pois já é tarde e o dia está terminando!”. Jesus entrou na casa e sentou-se à mesa com eles.","Quando Jesus pegou o pão, pronunciou a bênção, partiu-o e lhes deu, os olhos deles se abriram e o reconheceram! Alegres, voltaram correndo a Jerusalém contando como o coração deles ardia enquanto Jesus falava."]},{"id":64,"book":"Atos dos Apóstolos","testament":"Novo Testamento","title":"Pedro e a família de Cornélio","ref":"Atos 10,1-48","emoji":"🌍","scene":"rainbow","lesson":"O amor de Deus não faz diferença entre pessoas ou países: todos somos irmãos.","pages":["Na cidade de Cesareia morava um oficial romano chamado Cornélio, que era muito bondoso, ajudava os pobres e rezava todos os dias a Deus junto com toda a sua família.","Certa tarde, um anjo de Deus apareceu a Cornélio e disse: “Suas orações e boas ações chegaram até Deus! Mande chamar o apóstolo Pedro na cidade de Jope”.","Enquanto os mensageiros viajavam, Deus também preparou o coração de Pedro por meio de uma visão, ensinando que Deus ama todos os povos igualmente e que ninguém deve ser rejeitado.","Pedro foi até a casa de Cornélio, onde muitos parentes e amigos estavam reunidos ansiosos para ouvir falar de Jesus. Pedro anunciou com alegria a vida, a morte e a ressurreição de Cristo.","Enquanto Pedro ainda falava, o Espírito Santo desceu sobre todos os que ouviam a Palavra! Todos foram batizados com alegria, mostrando que a Igreja de Jesus é uma grande família aberta ao mundo inteiro."]}];

function storyIllustration(s, p){
  const imgPath = `assets/hist_${s.id}_pag_${p}.jpg`;
  return `
    <div class="story-art-container" id="art-container-${s.id}-${p}" role="button" tabindex="0" aria-label="Ampliar ilustração" onclick="openLightbox(${s.id}, ${p})">
      <img src="${imgPath}" alt="Ilustração ${esc(s.title)}" class="story-img" onerror="this.style.display='none'; document.getElementById('svg-fallback-${s.id}-${p}').style.display='block';">
      <span class="zoom-badge" id="badge-${s.id}-${p}">🔍 Ampliar</span>
      <div id="svg-fallback-${s.id}-${p}" style="display:none;">
        ${storyIllustrationFallback(s, p)}
      </div>
    </div>
  `;
}

function go(p){previous=page;page=p;render()}
function home(){page='home';render()}
function openStory(id){current=STORIES.find(s=>s.id===id);part=0;previous=page;page='reader';render()}
function storyCard(s){
  return `<button class="story-card" onclick="openStory(${s.id})"><div class="story-emoji">${s.emoji}</div><div><strong>${esc(s.title)}</strong><small>${esc(s.ref)} · ${esc(s.book)} · ${s.pages.length} partes</small></div><span class="arrow">›</span></button>`;
}
function listStories(arr){return `<div class="story-list">${arr.map(storyCard).join('')}</div>`}

function render(){
  back.classList.toggle('hidden',page==='home');
  document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===page));
  if(page==='reader'){renderReader();return}
  if(page==='home'){
    const oldCount = STORIES.filter(s=>s.testament==='Antigo Testamento').length;
    const newCount = STORIES.filter(s=>s.testament==='Novo Testamento').length;
    view.innerHTML=`<section class="hero"><div class="hero-copy"><span class="pill">✨ ${STORIES.length} HISTÓRIAS ILUSTRADAS</span><h1>Grandes histórias.<br>Pequenos corações.</h1><p>Descubra a Bíblia e aprenda sobre o amor de Deus!</p><button class="primary" onclick="go('old')">Começar a ler →</button></div><div class="hero-art">${heroIllustration()}</div></section><h2 class="section-title">Escolha sua aventura 📚</h2><div class="grid"><button class="test-card old" onclick="go('old')"><span>📜</span><strong>Antigo Testamento</strong><small>${oldCount} histórias do povo de Deus</small></button><button class="test-card new" onclick="go('new')"><span>✝️</span><strong>Novo Testamento</strong><small>${newCount} histórias de Jesus e da Igreja</small></button></div><div class="tools"><button class="tool" onclick="go('favorites')"><span>⭐</span>Favoritos</button><button class="tool" onclick="go('search')"><span>🔎</span>Buscar histórias</button><button class="tool" onclick="go('about')"><span>💛</span>Sobre o app</button></div><div class="quote">“Deixai vir a mim as crianças.”<br><small>Mateus 19,14</small></div><h2 class="section-title">🌟 Uma história para hoje</h2>${storyCard(STORIES[(new Date().getDate())%STORIES.length])}`;
    return;
  }
  if(page==='old'||page==='new'){
    let t=page==='old'?'Antigo Testamento':'Novo Testamento';
    let list=STORIES.filter(s=>s.testament===t);
    view.innerHTML=`<div class="tag">Explore as escrituras</div><h1 class="section-title" style="font-size:25px;margin-top:5px">${page==='old'?'📜':'✝️'} ${t}</h1><p style="color:#65758a;margin-top:-5px">${list.length} histórias ilustradas para conhecer e aprender.</p>${listStories(list)}`;
    return;
  }
  if(page==='favorites'){
    let arr=STORIES.filter(s=>favorites.includes(s.id));
    view.innerHTML=`<div class="tag">Suas histórias especiais</div><h1 class="section-title" style="font-size:25px;margin-top:5px">⭐ Meus favoritos</h1>${arr.length?listStories(arr):'<div class="empty"><div style="font-size:48px">⭐</div><strong>Você ainda não salvou histórias.</strong><p>Toque no coração de uma história para guardá-la aqui.</p></div>'}`;
    return;
  }
  if(page==='search'){
    view.innerHTML=`<div class="tag">Encontre sua história</div><h1 class="section-title" style="font-size:25px;margin-top:5px">🔎 Buscar histórias</h1><input id="q" class="search" placeholder="Digite um nome, livro ou personagem..." autocomplete="off"><div id="results">${listStories(STORIES.slice(0,10))}</div>`;
    document.getElementById('q').addEventListener('input',e=>{
      let q=e.target.value.toLocaleLowerCase('pt-BR');
      let arr=STORIES.filter(s=>(s.title+' '+s.book+' '+s.ref+' '+s.lesson).toLocaleLowerCase('pt-BR').includes(q));
      document.getElementById('results').innerHTML=arr.length?listStories(arr):'<div class="empty">Não encontramos essa história. Tente outro nome. 💛</div>';
    });
    return;
  }
  if(page==='about'){
    view.innerHTML=`<div class="about"><div style="font-size:42px;text-align:center">📖✨</div><h1 style="text-align:center">Minha Bíblia Infantil</h1><p>Um espaço especial para crianças de 6 a 10 anos conhecerem <strong>${STORIES.length} histórias da Bíblia Católica</strong> com linguagem acolhedora, ilustrações e ensinamentos para o dia a dia.</p><h3>📚 Conteúdo</h3><p>As histórias são narrativas infantis originais baseadas nas passagens bíblicas indicadas, divididas em 5 partes ilustradas para facilitar a leitura em família ou na catequese.</p><h3>⛪ Tradição católica</h3><p>A seleção contempla o cânon católico completo, incluindo livros deuterocanônicos como Tobias, Judite, Sabedoria, Eclesiástico, Baruc e 1 e 2 Macabeus.</p><h3>💡 Para famílias</h3><p>Algumas passagens apresentam conflitos e sofrimento. Recomendamos a leitura acompanhada por um adulto, que poderá conversar com a criança e responder às suas perguntas.</p><h3>📵 Funciona offline</h3><p>Todas as histórias e ilustrações estão integradas no próprio arquivo, funcionando perfeitamente no celular ou computador mesmo sem internet.</p><p style="text-align:center;color:#8290a0;font-size:12px">Versão 2.0 · Edição Ilustrada Expandida</p></div>`;
    return;
  }
}

function renderReader(){
  let s=current;
  let fav=favorites.includes(s.id);
  let dots=s.pages.map((_,i)=>`<span class="${i===part?'on':''}"></span>`).join('');
  view.innerHTML=`<div class="reader-head"><div class="bigemoji">${s.emoji}</div><div><div class="tag" style="color:#d8ebff">${esc(s.testament)} · ${esc(s.book)}</div><h2>${esc(s.title)}</h2><small>📖 ${esc(s.ref)}</small></div></div>${storyIllustration(s,part)}<div class="page-dots">${dots}</div><div class="page-text"><p>${esc(s.pages[part])}</p></div><div class="reader-controls"><button class="navbtn" id="prev" ${part===0?'disabled':''}>← Anterior</button><span class="counter">Parte ${part+1} de ${s.pages.length}</span><button class="navbtn" id="next">${part===s.pages.length-1?'Lição':'Próximo →'}</button></div><button class="favorite" id="fav">${fav?'♥ Remover dos favoritos':'♡ Salvar nos favoritos'}</button>${part===s.pages.length-1?`<div class="lesson"><strong>💡 O que aprendemos?</strong>${esc(s.lesson)}</div><button class="primary" style="width:100%;margin-top:15px" id="finish">Concluir história ✓</button>`:''}`;
  document.getElementById('prev').onclick=()=>{if(part>0){part--;renderReader();window.scrollTo({top:0,behavior:'smooth'})}};
  document.getElementById('next').onclick=()=>{if(part<s.pages.length-1){part++;renderReader();window.scrollTo({top:0,behavior:'smooth'})}else{document.querySelector('.lesson').scrollIntoView({behavior:'smooth',block:'center'})}};
  document.getElementById('fav').onclick=()=>{favorites=fav?favorites.filter(x=>x!==s.id):[...favorites,s.id];save();renderReader()};
  let f=document.getElementById('finish');
  if(f)f.onclick=()=>{page=s.testament==='Antigo Testamento'?'old':'new';render();window.scrollTo({top:0,behavior:'smooth'})};
}

back.onclick=()=>{if(page==='reader'){page=previous==='reader'?'home':previous}else page='home';render()};

<div id="imgLightbox" class="img-lightbox" role="dialog" aria-modal="true" aria-label="Imagem ampliada">
  <div class="lightbox-topbar">
    <button type="button" class="lightbox-btn" id="lightboxZoomBtn" aria-label="Alternar zoom">🔍+</button>
    <button type="button" class="lightbox-btn" id="lightboxClose" aria-label="Fechar imagem">✕</button>
  </div>
  <div class="lightbox-stage" id="lightboxStage">
    <div class="lightbox-media-wrap" id="lightboxMediaWrap">
      <img id="lightboxImg" src="" alt="Ilustração ampliada">
      <div id="lightboxSvgBox" class="lightbox-svg-box" style="display:none;"></div>
    </div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
    <div class="lightbox-hint">Toque na imagem para dar zoom • Toque fora para fechar</div>
  </div>
</div>
<script>
(function(){
  const lb = document.getElementById('imgLightbox');
  const lbStage = document.getElementById('lightboxStage');
  const lbWrap = document.getElementById('lightboxMediaWrap');
  const lbImg = document.getElementById('lightboxImg');
  const lbSvgBox = document.getElementById('lightboxSvgBox');
  const lbCap = document.getElementById('lightboxCaption');
  const lbClose = document.getElementById('lightboxClose');
  const lbZoomBtn = document.getElementById('lightboxZoomBtn');

  function updateZoomBtn(){
    lbZoomBtn.textContent = lb.classList.contains('zoomed') ? '🔍−' : '🔍+';
  }

  function toggleZoom(e){
    if (e) e.stopPropagation();
    lb.classList.toggle('zoomed');
    updateZoomBtn();
    if (lb.classList.contains('zoomed')) {
      requestAnimationFrame(() => {
        lbStage.scrollLeft = (lbStage.scrollWidth - lbStage.clientWidth) / 2;
        lbStage.scrollTop = (lbStage.scrollHeight - lbStage.clientHeight) / 2;
      });
    }
  }

  window.openLightbox = function(sId, pIdx){
    const story = (window.STORIES || []).find(item => item.id === sId);
    const caption = story ? `${story.title} — Parte ${pIdx + 1}` : '';
    const fallback = document.getElementById(`svg-fallback-${sId}-${pIdx}`);
    const isSvgFallback = fallback && fallback.style.display === 'block';

    if (isSvgFallback) {
      lbImg.style.display = 'none';
      lbImg.removeAttribute('src');
      lbSvgBox.innerHTML = fallback.innerHTML;
      lbSvgBox.style.display = 'block';
    } else {
      lbSvgBox.style.display = 'none';
      lbSvgBox.innerHTML = '';
      lbImg.src = `assets/hist_${sId}_pag_${pIdx}.jpg`;
      lbImg.style.display = 'block';
    }

    lbCap.textContent = caption;
    lb.classList.remove('zoomed');
    updateZoomBtn();
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  };

  function closeLightbox(){
    lb.classList.remove('open', 'zoomed');
    updateZoomBtn();
    document.body.style.overflow = '';
  }

  lbClose.addEventListener('click', function(e){
    e.stopPropagation();
    closeLightbox();
  });

  lbZoomBtn.addEventListener('click', toggleZoom);
  lbImg.addEventListener('click', toggleZoom);
  lbSvgBox.addEventListener('click', toggleZoom);

  lbStage.addEventListener('click', function(e){
    if (e.target === lbStage || e.target === lbWrap || e.target === lbCap) {
      closeLightbox();
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && lb.classList.contains('open')) {
      closeLightbox();
    }
  });

  window.addEventListener('orientationchange', function(){
    if (lb.classList.contains('open')) {
      lb.classList.remove('zoomed');
      updateZoomBtn();
    }
  });
})();
</script>
</body></html>
